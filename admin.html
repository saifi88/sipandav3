<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - SI-PANDA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-slate-800">
    <div id="admin-root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyvjyIw545RQ6VIphJ3hjhz703hwJf0kOwtXj8R2su-64PIbyaiSMiqtP7sTrf7Jt0TFw/exec";

        const MAPEL_LIST = [
            "Pendidikan Pancasila", "Bahasa Indonesia", "Matematika", "IPAS", 
            "Seni Rupa", "Bahasa Jawa", "Bahasa Inggris", "Koding & AI"
        ];

        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                'user': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
                'file-text': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>,
                'check-circle': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>,
                'clock': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
                'list': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>,
                'log-out': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>,
                'message-square': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>,
                'save': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
                'edit': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
                'x': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            };
            return icons[name] || null;
        };

        async function hashString(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function NoteModal({ r, onClose, onSave }) {
            const [text, setText] = useState(r.catatan || "");

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave(r.nisn, r.ujian, text);
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 animate-in border border-slate-100">
                        <div className="flex justify-between items-center mb-4 border-b pb-3">
                            <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                <Icon name="message-square" size={20} className="text-blue-600" /> Beri Catatan
                            </h3>
                            <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer">
                                <Icon name="x" size={20} />
                            </button>
                        </div>

                        <div className="bg-blue-50/70 border border-blue-100 rounded-xl p-3.5 mb-4 text-xs space-y-1.5">
                            <div className="flex justify-between">
                                <span className="text-slate-500">Nama Siswa:</span>
                                <span className="font-bold text-slate-800">{r.nama}</span>
                            </div>
                            <div className="flex justify-between">
                                <span className="text-slate-500">NISN:</span>
                                <span className="font-mono font-semibold text-slate-700">{r.nisn}</span>
                            </div>
                            <div className="flex justify-between">
                                <span className="text-slate-500">Mapel:</span>
                                <span className="font-semibold text-blue-700">{r.ujian}</span>
                            </div>
                            <div className="flex justify-between">
                                <span className="text-slate-500">Nilai:</span>
                                <span className="font-black text-green-600">{r.nilai}</span>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Catatan</label>
                                <textarea 
                                    rows="3"
                                    value={text} 
                                    onChange={(e) => setText(e.target.value)} 
                                    placeholder="Beri catatan untuk siswa..." 
                                    className="w-full px-3.5 py-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                                    autoFocus
                                ></textarea>
                            </div>

                            <div className="flex gap-2 pt-2">
                                <button type="button" onClick={onClose} className="flex-1 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors cursor-pointer">
                                    Batal
                                </button>
                                <button type="submit" className="flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold transition-colors shadow-sm flex items-center justify-center gap-1.5 cursor-pointer">
                                    <Icon name="save" size={14} /> Simpan
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ResultRow({ r, onUpdateCatatan }) {
            const [showModal, setShowModal] = useState(false);

            return (
                <>
                    <tr className="border-b hover:bg-gray-50">
                        <td className="p-2 border-r text-xs">{r.waktu}</td>
                        <td className="p-2 border-r font-mono">{r.nisn}</td>
                        <td className="p-2 border-r font-bold">{r.nama}</td>
                        <td className="p-2 border-r">{r.ujian}</td>
                        <td className="p-2 border-r text-center font-bold text-blue-600">{r.nilai}</td>
                        <td className="p-2 border-r text-center">{r.pelanggaran || 0}</td>
                        <td className="p-2">
                            <div className="flex items-center gap-2">
                                <span className="text-xs text-slate-600 italic truncate max-w-[150px]">{r.catatan || '(Belum ada catatan)'}</span>
                                <button 
                                    onClick={() => setShowModal(true)} 
                                    className="ml-auto px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg text-xs font-bold flex items-center gap-1 transition-colors shrink-0 border border-blue-200 cursor-pointer"
                                    title="Beri/Ubah Catatan"
                                >
                                    <Icon name="edit" size={14} /> <span>Catatan</span>
                                </button>
                            </div>
                        </td>
                    </tr>

                    {showModal && (
                        <NoteModal 
                            r={r} 
                            onClose={() => setShowModal(false)} 
                            onSave={onUpdateCatatan} 
                        />
                    )}
                </>
            );
        }

        function AdminApp() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(true);
            const [appData, setAppData] = useState({ settings: {}, students: [], exams: [], results: [], materi: [], games: [], gameResults: [] });

            useEffect(() => {
                fetch(WEB_APP_URL + "?action=getInitData")
                    .then(res => res.json())
                    .then(data => {
                        setAppData({
                            settings: data.settings || {},
                            students: data.students || [],
                            exams: data.exams || [],
                            results: data.results || [],
                            materi: data.materi || [],
                            games: data.games || [],
                            gameResults: data.gameResults || []
                        });
                        setLoading(false);
                    })
                    .catch(err => { console.error(err); setLoading(false); });
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                const validUser = appData.settings.adminUser || 'admin';
                const inputPassHash = await hashString(password);
                const validPassHash = appData.settings.adminPassHash || '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9';

                if (username === validUser && inputPassHash === validPassHash) {
                    setIsLoggedIn(true);
                } else {
                    setError('Username atau Password salah.');
                }
            };

            const handleToggleExamStatus = (examId) => {
                setAppData(prev => {
                    const updatedExams = prev.exams.map(ex => {
                        if (ex.id === examId) {
                            const newStatus = !ex.isActive;
                            fetch(WEB_APP_URL, {
                                method: 'POST',
                                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify({ action: "updateExamStatus", examId: examId, isActive: newStatus })
                            });
                            return { ...ex, isActive: newStatus };
                        }
                        return ex;
                    });
                    return { ...prev, exams: updatedExams };
                });
            };

            const handleUpdateCatatan = (nisn, ujian, newCatatan) => {
                setAppData(prev => {
                    const updatedResults = prev.results.map(r => {
                        if (r.nisn === nisn && r.ujian === ujian) {
                            return { ...r, catatan: newCatatan };
                        }
                        return r;
                    });
                    return { ...prev, results: updatedResults };
                });

                fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "updateCatatan", nisn: nisn, ujian: ujian, catatan: newCatatan })
                });
            };

            if (loading) {
                return <div className="h-screen flex items-center justify-center bg-slate-900 text-white font-bold">Silakan tunggu...</div>;
            }

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 border border-slate-800">
                            <div className="text-center mb-6">
                                <h2 className="text-2xl font-black text-slate-800">Panel Admin</h2>
                            </div>
                            {error && <div className="mb-4 p-3 bg-red-50 text-red-600 text-xs rounded-lg font-bold">{error}</div>}
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">Username</label>
                                    <input type="text" required value={username} onChange={e => setUsername(e.target.value)} className="w-full px-4 py-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">Password</label>
                                    <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                                </div>
                                <button type="submit" className="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold text-sm transition-colors shadow-md cursor-pointer">LOGIN</button>
                            </form>
                            <div className="mt-4 text-center">
                                <a href="index.html" className="text-xs text-blue-600 hover:underline">← Kembali ke Halaman Siswa</a>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <AdminDashboardFull 
                    exams={appData.exams} 
                    results={appData.results} 
                    students={appData.students} 
                    materiList={appData.materi} 
                    games={appData.games}
                    gameResults={appData.gameResults}
                    onToggleStatus={handleToggleExamStatus} 
                    onUpdateCatatan={handleUpdateCatatan} 
                    onLogout={() => setIsLoggedIn(false)}
                />
            );
        }

        function GameAdminPanelStandalone({ games = [], gameResults = [], exams = [] }) {
            const [form, setForm] = useState({ id: '', type: 'match', mapel: MAPEL_LIST[0], title: '', duration: 3, linkedExamId: '', pairsText: '[{"left":"Akar","right":"Menyerap air"}]' });
            const [saving, setSaving] = useState(false);
            const [aiFiles, setAiFiles] = useState([]);
            const [aiLoading, setAiLoading] = useState(false);
            const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
            const handleAiFiles = (e) => {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;
                let loaded = [];
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        loaded.push({ name: file.name, mimeType: file.type, base64: String(ev.target.result).split(',')[1] });
                        if (loaded.length === files.length) setAiFiles(prev => [...prev, ...loaded]);
                    };
                    reader.readAsDataURL(file);
                });
            };
            const handleGeneratePairs = async () => {
                if (!aiFiles.length) { alert("Unggah materi dulu."); return; }
                setAiLoading(true);
                try {
                    const res = await fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "generateGamePairs", files: aiFiles, mapel: form.mapel, gameType: form.type }) });
                    const out = await res.json();
                    if (out.status === "success" && out.pairs) { set('pairsText', JSON.stringify(out.pairs, null, 1)); alert("AI membuat " + out.pairs.length + " pasangan."); }
                    else throw new Error(out.message || "Gagal");
                } catch (err) { alert("Gagal generate: " + err.message); }
                finally { setAiLoading(false); }
            };
            const handleSave = async (e) => {
                e.preventDefault();
                let pairs;
                try { pairs = JSON.parse(form.pairsText); if (!Array.isArray(pairs) || !pairs.length) throw new Error("kosong"); }
                catch (err) { alert("pairsText harus JSON array valid."); return; }
                const gid = form.id.trim() || ("game-" + form.type + "-" + Date.now().toString().slice(-5));
                setSaving(true);
                try {
                    await fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "saveGame", game: { id: gid, type: form.type, mapel: form.mapel, title: form.title || "Game Baru", duration: Number(form.duration) || 3, isActive: true, linkedExamId: form.linkedExamId, pairs } }) });
                    alert("Game tersimpan: " + gid); window.location.reload();
                } catch (err) { alert("Gagal: " + err.message); setSaving(false); }
            };
            const topFor = (gid) => (gameResults || []).filter(r => r.gameId === gid).sort((a, b) => b.skor - a.skor).slice(0, 3);
            return (
                <div className="space-y-4 animate-in pb-10">
                    <div className="bg-violet-50 border border-violet-200 p-3 text-xs text-violet-800">Game = latihan bonus. Hubungkan <b>linkedExamId</b> agar muncul di kartu tugas & materi. Skor tidak mengubah nilai formal.</div>
                    <div className="bg-white border border-gray-300 shadow-sm">
                        <div className="bg-violet-600 text-white p-3 font-semibold text-sm">Tambah / Update Game</div>
                        <form onSubmit={handleSave} className="p-4 space-y-3">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <div><label className="block text-xs font-semibold mb-1">ID (opsional)</label><input value={form.id} onChange={e => set('id', e.target.value)} className="w-full p-2 border text-sm" placeholder="match-mtk-02" /></div>
                                <div><label className="block text-xs font-semibold mb-1">Tipe</label><select value={form.type} onChange={e => set('type', e.target.value)} className="w-full p-2 border text-sm"><option value="match">match</option><option value="memory">memory</option><option value="quizrush">quizrush</option><option value="balloon">balloon</option><option value="scramble">scramble</option><option value="snake">snake</option><option value="truefalse">truefalse</option><option value="hangman">hangman</option><option value="boss">boss</option><option value="sort">sort</option><option value="fillblank">fillblank</option><option value="race">race</option></select></div>
                                <div><label className="block text-xs font-semibold mb-1">Mapel</label><select value={form.mapel} onChange={e => set('mapel', e.target.value)} className="w-full p-2 border text-sm">{MAPEL_LIST.map(m => <option key={m} value={m}>{m}</option>)}</select></div>
                                <div className="md:col-span-2"><label className="block text-xs font-semibold mb-1">Judul</label><input value={form.title} onChange={e => set('title', e.target.value)} className="w-full p-2 border text-sm" /></div>
                                <div><label className="block text-xs font-semibold mb-1">Durasi</label><input type="number" value={form.duration} onChange={e => set('duration', e.target.value)} className="w-full p-2 border text-sm" /></div>
                                <div className="md:col-span-3"><label className="block text-xs font-semibold mb-1">Hubungkan ke Tugas</label><select value={form.linkedExamId} onChange={e => set('linkedExamId', e.target.value)} className="w-full p-2 border text-sm"><option value="">-- Bebas --</option>{exams.map(ex => <option key={ex.id} value={ex.id}>{ex.title} ({ex.id})</option>)}</select></div>
                            </div>
                            <div><label className="block text-xs font-semibold mb-1">Pairs JSON</label><textarea rows="4" value={form.pairsText} onChange={e => set('pairsText', e.target.value)} className="w-full p-2 border text-xs font-mono"></textarea></div>
                            <div className="flex flex-wrap gap-2 items-center">
                                <input type="file" multiple onChange={handleAiFiles} className="text-xs" />
                                <button type="button" onClick={handleGeneratePairs} disabled={aiLoading || !aiFiles.length} className="px-3 py-2 bg-violet-600 text-white text-xs font-bold disabled:bg-gray-400 cursor-pointer">{aiLoading ? "AI..." : "✨ Generate AI"}</button>
                                <button type="submit" disabled={saving} className="ml-auto px-4 py-2 bg-emerald-600 text-white text-xs font-bold cursor-pointer">{saving ? "Menyimpan..." : "Simpan Game"}</button>
                            </div>
                        </form>
                    </div>
                    <div className="bg-white border border-gray-300 shadow-sm">
                        <div className="bg-slate-700 text-white p-3 font-semibold text-sm">Daftar Game ({games.length}) + Top Skor</div>
                        <div className="p-4 space-y-2">
                            {games.map(g => (
                                <div key={g.id} className="border p-3 bg-gray-50 flex flex-col sm:flex-row justify-between gap-2">
                                    <div><h4 className="font-bold text-sm">{g.title} <span className="text-[10px] bg-violet-100 px-2 py-0.5 rounded-full">{g.type}</span></h4><p className="text-xs text-gray-500">{g.id} · {g.mapel} · {(g.pairs || []).length} pasangan{g.linkedExamId ? ` · 🔗 ${g.linkedExamId}` : ""}</p>{topFor(g.id).length > 0 && <p className="text-[11px] text-amber-600">🏆 {topFor(g.id).map(t => `${t.nama}:${t.skor}`).join(" · ")}</p>}</div>
                                    <button onClick={() => setForm({ id: g.id, type: g.type, mapel: g.mapel, title: g.title, duration: g.duration, linkedExamId: g.linkedExamId || '', pairsText: JSON.stringify(g.pairs || [], null, 1) })} className="px-3 py-1.5 bg-white border text-xs font-bold cursor-pointer self-start">Edit</button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function AdminDashboardFull({ exams, results, students, materiList, games = [], gameResults = [], onToggleStatus, onUpdateCatatan, onLogout }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [loadingMateri, setLoadingMateri] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);

            const [aiMapel, setAiMapel] = useState(MAPEL_LIST[0]);
            const [aiFiles, setAiFiles] = useState([]);
            const [aiLoading, setAiLoading] = useState(false);
            const [aiGeneratedQuestions, setAiGeneratedQuestions] = useState([]);
            const [examTitle, setExamTitle] = useState('');
            const [isPublishing, setIsPublishing] = useState(false);

            const [selectedFilterStatus, setSelectedFilterStatus] = useState('ALL'); 
            const [selectedExamFilter, setSelectedExamFilter] = useState(exams.length > 0 ? exams[0].title : '');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedMapelFilter, setSelectedMapelFilter] = useState('ALL');
            const [selectedMateriMapelFilter, setSelectedMateriMapelFilter] = useState('ALL');

            const handleFileChange = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                let loadedFiles = [];
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (uploadEvent) => {
                        const base64String = uploadEvent.target.result.split(',')[1];
                        loadedFiles.push({ name: file.name, mimeType: file.type, base64: base64String });
                        if (loadedFiles.length === files.length) { setAiFiles(prev => [...prev, ...loadedFiles]); }
                    };
                    reader.readAsDataURL(file);
                });
            };

            const removeAiFile = (index) => setAiFiles(prev => prev.filter((_, i) => i !== index));

            const handleGenerateAI = async () => {
                if (aiFiles.length === 0) { alert("Silakan upload materi terlebih dahulu."); return; }
                setAiLoading(true); setAiGeneratedQuestions([]);
                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "generateAIQuestions", files: aiFiles, mapel: aiMapel })
                    });
                    const result = await response.json();
                    if (result.status === "success" && result.questions) {
                        setAiGeneratedQuestions(result.questions); setAiLoading(false);
                        alert("Berhasil generate " + result.questions.length + " soal.");
                    } else { throw new Error(result.message || "Gagal memproses AI."); }
                } catch (error) { alert("Terjadi kesalahan: " + error.message); setAiLoading(false); }
            };

            const handleQuestionChange = (index, field, value) => {
                const updated = [...aiGeneratedQuestions]; updated[index][field] = value; setAiGeneratedQuestions(updated);
            };

            const handleOptionChange = (qIndex, optIndex, value) => {
                const updated = [...aiGeneratedQuestions]; updated[qIndex].options[optIndex] = value; setAiGeneratedQuestions(updated);
            };

            const handlePublishAiExam = async () => {
                if (!examTitle.trim()) { alert("Topik wajib diisi."); return; }
                if (aiGeneratedQuestions.length === 0) { alert("Belum ada soal."); return; }
                setIsPublishing(true);

                const now = new Date();
                const dd = String(now.getDate()).padStart(2, '0');
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const mapelCode = aiMapel.replace(/[^a-zA-Z0-9]/g, "").toUpperCase(); 
                const examIdGenerated = `${mapelCode}_${dd}${mm}`;
                const finalTitle = `PR ${aiMapel} - ${examTitle}`;
                const calculatedDuration = aiGeneratedQuestions.length; 

                const formattedQuestions = aiGeneratedQuestions.slice(0, 30).map((q, index) => ({
                    q_id: index + 1, text: q.text, options: q.options, answer: q.answer
                }));

                const newExamData = {
                    action: "saveNewExam", id: examIdGenerated, title: finalTitle, duration: calculatedDuration, isActive: true, questions: formattedQuestions
                };

                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(newExamData)
                    });
                    alert("Tugas berhasil diterbitkan!");
                    setIsPublishing(false); setAiGeneratedQuestions([]); setAiFiles([]); setExamTitle(''); setActiveTab('overview');
                } catch (err) { alert("Gagal menerbitkan tugas: " + err.message); setIsPublishing(false); }
            };

            const handleAddMateri = async (e) => {
                e.preventDefault(); 
                const form = e.target; 
                setLoadingMateri(true);
                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST', 
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ 
                            action: "addMateri", 
                            mapel: form.mapel.value, 
                            judul: form.judul.value, 
                            pdf: form.pdf.value, 
                            gambar: form.gambar.value,
                            linkedExamId: form.linkedExamId.value // <-- Menangkap ID ujian terpilih dari dropdown
                        })
                    });
                    alert("Materi berhasil ditambahkan!"); 
                    form.reset();
                } catch (error) { 
                    alert("Gagal menyimpan materi: " + error.message); 
                } 
                finally { 
                    setLoadingMateri(false); 
                }
            };

            const totalStudents = students.length;
            const examResults = (results || []).filter(r => r.ujian === selectedExamFilter);
            const doneNisns = new Set(examResults.map(r => String(r.nisn)));
            const completedCount = doneNisns.size;
            const pendingCount = Math.max(0, totalStudents - completedCount);

            const studentStatusList = students.map(student => {
                const isDone = doneNisns.has(String(student.nisn));
                const res = examResults.find(r => String(r.nisn) === String(student.nisn));
                return { ...student, isDone, nilai: isDone ? res.nilai : '-', waktu: isDone ? res.waktu : '-', pelanggaran: isDone ? res.pelanggaran : 0, catatan: isDone ? res.catatan : '' };
            });

            const filteredStudents = studentStatusList.filter(s => {
                if (selectedFilterStatus === 'DONE' && !s.isDone) return false;
                if (selectedFilterStatus === 'PENDING' && s.isDone) return false;
                if (searchQuery.trim() !== '') {
                    const q = searchQuery.toLowerCase();
                    return s.name.toLowerCase().includes(q) || String(s.nisn).toLowerCase().includes(q);
                }
                return true;
            });

            const filteredMateriList = (!materiList || materiList.length === 0) ? [] : materiList.filter(item => {
                if (selectedMateriMapelFilter === 'ALL') return true;
                return item.mapel === selectedMateriMapelFilter;
            });

            const navItemClass = (tabName) => `w-full text-left px-4 py-3 text-sm font-medium cursor-pointer transition-all flex items-center gap-3 border-l-4 ${activeTab === tabName ? 'bg-slate-700 border-cyan-400 text-white' : 'border-transparent text-slate-300 hover:bg-slate-700 hover:text-white'}`;

            return (
                <div className="bg-gray-100 flex h-screen overflow-hidden font-sans relative">
                    {isSidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-slate-900/60 z-30 md:hidden backdrop-blur-sm"
                            onClick={() => setIsSidebarOpen(false)}
                        ></div>
                    )}
                    {/* SIDEBAR */}
                        <div className={`fixed inset-y-0 left-0 z-40 w-64 bg-slate-800 flex flex-col shadow-2xl transition-transform transform md:relative md:translate-x-0 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-4 border-b border-slate-700 flex items-center justify-between bg-slate-800 sticky top-0">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-slate-600 rounded-full flex items-center justify-center text-slate-300 shrink-0 border border-slate-500">
                                    <Icon name="user" size={20} />
                                </div>
                                <div className="overflow-hidden">
                                    <h3 className="font-bold text-white text-xs truncate">Guru</h3>
                                    <p className="text-[10px] text-slate-400 truncate">SDN 3 Wonorejo</p>
                                </div>
                            </div>
                            <button onClick={onLogout} className="text-slate-400 hover:text-red-400 transition-colors" title="Keluar">
                                <Icon name="log-out" size={18} />
                            </button>
                        </div>
                        <nav className="py-2 flex-1 overflow-y-auto">
                            <button onClick={() => { setActiveTab('overview'); setIsSidebarOpen(false); }} className={navItemClass('overview')}>Beranda</button>
                            <button onClick={() => { setActiveTab('ai-generator'); setIsSidebarOpen(false); }} className={navItemClass('ai-generator')}>Generate Soal AI</button>
                            <button onClick={() => { setActiveTab('games'); setIsSidebarOpen(false); }} className={navItemClass('games')}>🎮 Kelola Game</button>
                            <button onClick={() => { setActiveTab('materi'); setIsSidebarOpen(false); }} className={navItemClass('materi')}>Kelola Materi</button>
                            <button onClick={() => { setActiveTab('exams'); setIsSidebarOpen(false); }} className={navItemClass('exams')}>Kelola Tugas</button>
                            <button onClick={() => { setActiveTab('results'); setIsSidebarOpen(false); }} className={navItemClass('results')}>Rekap Nilai</button>
                        </nav>
                        <div className="p-4 border-t border-slate-700">
                            <a href="index.html" className="text-xs text-slate-400 hover:text-white flex items-center gap-2">← Ke Halaman Siswa</a>
                        </div>
                    </div>

                    {/* KONTEN UTAMA */}
                    <div className="flex-1 flex flex-col overflow-hidden bg-gray-100 min-w-0">
                        <div className="bg-red-500 text-white p-3 shadow-md flex items-center z-20 w-full shrink-0">
                            <button 
                                onClick={() => setIsSidebarOpen(true)} 
                                className="md:hidden mr-3 p-1 bg-red-600 hover:bg-red-700 rounded-md transition-colors"
                            >
                                <Icon name="list" size={20} />
                            </button>
                            <Icon name="list" size={20} className="hidden md:block mr-3 cursor-pointer opacity-80" />
                            <h2 className="font-bold text-sm uppercase tracking-wide truncate">SI-PANDA 2026a</h2>
                        </div>

                        <div className="flex-1 p-4 lg:p-6 overflow-y-auto">
                            {activeTab === 'overview' && (
                                <div className="space-y-4 animate-in pb-10">
                                    <div className="bg-emerald-500 text-white px-4 py-2 text-sm font-semibold">
                                        Selamat Datang Admin SI-PANDA
                                    </div>

                                    {/* KARTU STATISTIK GAYA DAPODIK (LENGKUNG & DETAIL ISI) */}
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        
                                        {/* Card 1: Total Siswa (Ungu) */}
                                        <div 
                                            onClick={() => setSelectedFilterStatus('ALL')}
                                            className={`rounded-lg overflow-hidden shadow-sm cursor-pointer transition-all border ${selectedFilterStatus === 'ALL' ? 'ring-4 ring-purple-300' : 'hover:shadow-md'}`}
                                        >
                                            <div className="bg-purple-600 p-4 text-white flex items-center justify-between">
                                                <div className="opacity-90">
                                                    <Icon name="file-text" size={36} />
                                                </div>
                                                <div className="text-right">
                                                    <h3 className="text-4xl font-black leading-none">{totalStudents}</h3>
                                                </div>
                                            </div>
                                            <div className="bg-purple-700 px-4 py-2 text-white text-xs font-semibold flex items-center gap-2">
                                                <Icon name="user" size={14} /> Jumlah Peserta Didik
                                            </div>
                                        </div>

                                        {/* Card 2: Sudah Mengerjakan (Hijau) */}
                                        <div 
                                            onClick={() => setSelectedFilterStatus('DONE')}
                                            className={`rounded-lg overflow-hidden shadow-sm cursor-pointer transition-all border ${selectedFilterStatus === 'DONE' ? 'ring-4 ring-emerald-300' : 'hover:shadow-md'}`}
                                        >
                                            <div className="bg-emerald-500 p-4 text-white flex items-center justify-between">
                                                <div className="opacity-90">
                                                    <Icon name="check-circle" size={36} />
                                                </div>
                                                <div className="text-right">
                                                    <h3 className="text-4xl font-black leading-none">{completedCount}</h3>
                                                </div>
                                            </div>
                                            <div className="bg-emerald-600 px-4 py-2 text-white text-xs font-semibold flex items-center gap-2">
                                                <Icon name="check-circle" size={14} /> Sudah Mengerjakan
                                            </div>
                                        </div>

                                        {/* Card 3: Belum Mengerjakan (Oranye/Merah) */}
                                        <div 
                                            onClick={() => setSelectedFilterStatus('PENDING')}
                                            className={`rounded-lg overflow-hidden shadow-sm cursor-pointer transition-all border ${selectedFilterStatus === 'PENDING' ? 'ring-4 ring-orange-300' : 'hover:shadow-md'}`}
                                        >
                                            <div className="bg-orange-500 p-4 text-white flex items-center justify-between">
                                                <div className="opacity-90">
                                                    <Icon name="clock" size={36} />
                                                </div>
                                                <div className="text-right">
                                                    <h3 className="text-4xl font-black leading-none">{pendingCount}</h3>
                                                </div>
                                            </div>
                                            <div className="bg-orange-600 px-4 py-2 text-white text-xs font-semibold flex items-center gap-2">
                                                <Icon name="clock" size={14} /> Belum Mengerjakan
                                            </div>
                                        </div>

                                    </div>

                                    <div className="bg-white border border-gray-300 shadow-sm">
                                        <div className="bg-cyan-600 text-white p-3 font-semibold text-sm flex items-center gap-2">
                                            <Icon name="list" size={18} /> Pantau Pengerjaan Siswa
                                        </div>
                                        <div className="p-4 space-y-4">
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Tugas / Ujian</label>
                                                    <select value={selectedExamFilter} onChange={(e) => setSelectedExamFilter(e.target.value)} className="w-full p-2 border border-gray-300 text-sm outline-none cursor-pointer">
                                                        {exams.map((ex, idx) => <option key={idx} value={ex.title}>{ex.title}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Cari Siswa</label>
                                                    <input type="text" placeholder="NISN / Nama" value={searchQuery || ''} onChange={(e) => setSearchQuery(e.target.value)} className="w-full p-2 border border-gray-300 text-sm outline-none" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Mapel</label>
                                                    <select value={selectedMapelFilter || 'ALL'} onChange={(e) => { const val = e.target.value; setSelectedMapelFilter(val); if(val !== 'ALL') { const matchedExam = exams.find(ex => ex.title.toLowerCase().includes(val.toLowerCase())); if(matchedExam) setSelectedExamFilter(matchedExam.title); } }} className="w-full p-2 border border-gray-300 text-sm outline-none cursor-pointer">
                                                        <option value="ALL">Semua Mapel</option>
                                                        {MAPEL_LIST.map((m, idx) => <option key={idx} value={m}>{m}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            
                                            <div className="overflow-x-auto border border-gray-200">
                                                <table className="w-full text-sm text-left">
                                                    <thead className="bg-gray-100 border-b border-gray-300 text-gray-700 font-semibold">
                                                        <tr>
                                                            <th className="p-3 border-r">NISN</th>
                                                            <th className="p-3 border-r">Nama Siswa</th>
                                                            <th className="p-3 border-r text-center">Status</th>
                                                            <th className="p-3 border-r text-center">Nilai</th>
                                                            <th className="p-3">Waktu</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {filteredStudents.length === 0 ? (
                                                            <tr><td colSpan="5" className="p-6 text-center text-gray-500">Siswa tidak ditemukan.</td></tr>
                                                        ) : (
                                                            filteredStudents.map((s, idx) => (
                                                                <tr key={idx} className="border-b border-gray-200 hover:bg-gray-50">
                                                                    <td className="p-3 border-r">{s.nisn}</td>
                                                                    <td className="p-3 border-r font-semibold">{s.name}</td>
                                                                    <td className="p-3 border-r text-center">
                                                                        {s.isDone ? <span className="text-emerald-600 font-bold">Selesai</span> : <span className="text-amber-600 font-bold">Belum</span>}
                                                                    </td>
                                                                    <td className="p-3 border-r text-center font-bold">{s.nilai}</td>
                                                                    <td className="p-3 text-xs text-gray-500">{s.waktu}</td>
                                                                </tr>
                                                            ))
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'ai-generator' && (
                                <div className="space-y-4 animate-in pb-10">
                                    <div className="bg-white border border-gray-300 shadow-sm">
                                        <div className="bg-blue-600 text-white p-3 font-semibold text-sm">Generator Soal Berbasis AI</div>
                                        <div className="p-4 space-y-4">
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Pilih Mapel</label>
                                                    <select value={aiMapel} onChange={(e) => setAiMapel(e.target.value)} className="w-full p-2 border border-gray-300 text-sm outline-none cursor-pointer">
                                                        {MAPEL_LIST.map((m, idx) => <option key={idx} value={m}>{m}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Upload File Materi (JPG/PNG/PDF)</label>
                                                    <input type="file" multiple onChange={handleFileChange} className="w-full p-1.5 border border-gray-300 text-sm bg-gray-50 outline-none cursor-pointer" />
                                                </div>
                                            </div>
                                            {aiFiles.length > 0 && (
                                                <div className="flex flex-wrap gap-2 pt-2">
                                                    {aiFiles.map((file, idx) => (
                                                        <span key={idx} className="bg-gray-200 text-xs px-2 py-1 rounded border flex items-center gap-1">
                                                            {file.name} <button onClick={() => removeAiFile(idx)} className="text-red-600 font-bold ml-1">×</button>
                                                        </span>
                                                    ))}
                                                </div>
                                            )}
                                            <button onClick={handleGenerateAI} disabled={aiLoading || aiFiles.length === 0} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white text-sm font-semibold shadow-sm cursor-pointer">
                                                {aiLoading ? 'Memproses AI...' : 'Proses & Buat Soal'}
                                            </button>
                                        </div>
                                    </div>

                                    {aiGeneratedQuestions.length > 0 && (
                                        <div className="bg-white border border-gray-300 shadow-sm mt-4">
                                            <div className="bg-emerald-600 text-white p-3 font-semibold text-sm">Review & Pengaturan Ujian</div>
                                            <div className="p-4 space-y-4">
                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-600 mb-1">Judul Tugas</label>
                                                    <input type="text" value={examTitle} onChange={(e) => setExamTitle(e.target.value)} className="w-full p-2 border border-gray-300 text-sm outline-none" placeholder="Contoh: Tata Surya" />
                                                </div>
                                                <div className="space-y-4 border-t border-gray-200 pt-4">
                                                    {aiGeneratedQuestions.map((q, qIdx) => (
                                                        <div key={qIdx} className="p-4 bg-gray-50 border border-gray-200 space-y-2">
                                                            <span className="text-xs font-bold bg-gray-200 px-2 py-1">Soal {qIdx + 1}</span>
                                                            <textarea rows="2" value={q.text} onChange={(e) => handleQuestionChange(qIdx, 'text', e.target.value)} className="w-full p-2 border border-gray-300 text-sm"></textarea>
                                                            <div className="grid grid-cols-2 gap-2">
                                                                {q.options.map((opt, optIdx) => (
                                                                    <div key={optIdx} className="flex gap-2 items-center">
                                                                        <span className="font-bold text-xs">{['A', 'B', 'C', 'D'][optIdx]}</span>
                                                                        <input type="text" value={opt} onChange={(e) => handleOptionChange(qIdx, optIdx, e.target.value)} className="w-full p-1.5 border border-gray-300 text-sm" />
                                                                    </div>
                                                                ))}
                                                            </div>
                                                            <div className="mt-2 text-sm text-emerald-700 font-semibold">
                                                                Jawaban Benar: 
                                                                <select value={q.answer} onChange={(e) => handleQuestionChange(qIdx, 'answer', Number(e.target.value))} className="ml-2 p-1 border border-gray-300 cursor-pointer">
                                                                    <option value={0}>A</option><option value={1}>B</option><option value={2}>C</option><option value={3}>D</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                                <button onClick={handlePublishAiExam} disabled={isPublishing} className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-400 text-white font-bold cursor-pointer">
                                                    {isPublishing ? 'Menyimpan...' : 'Rilis Tugas Sekarang'}
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeTab === 'games' && (
                                <GameAdminPanelStandalone games={games} gameResults={gameResults} exams={exams} />
                            )}

                            {activeTab === 'exams' && (
                                <div className="bg-white border border-gray-300 shadow-sm animate-in pb-10">
                                    <div className="bg-indigo-600 text-white p-3 font-semibold text-sm">Kelola Tugas</div>
                                    <div className="p-4 space-y-2">
                                        {exams.map(e => (
                                            <div key={e.id} className="border border-gray-200 p-3 bg-gray-50 flex justify-between items-center">
                                                <div><h4 className="font-bold text-gray-800">{e.title}</h4><p className="text-xs text-gray-500">ID: {e.id}</p></div>
                                                <button onClick={() => onToggleStatus(e.id)} className={`px-4 py-2 text-xs font-bold text-white shadow-sm cursor-pointer ${e.isActive ? 'bg-emerald-500' : 'bg-gray-500'}`}>
                                                    {e.isActive ? 'AKTIF' : 'NON-AKTIF'}
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'results' && (
                                <div className="bg-white border border-gray-300 shadow-sm animate-in pb-10">
                                    <div className="bg-amber-600 text-white p-3 font-semibold text-sm">Rekap Nilai Siswa</div>
                                    <div className="overflow-x-auto p-4">
                                        <table className="w-full text-sm text-left border border-gray-200">
                                            <thead className="bg-gray-100 border-b border-gray-300 text-gray-700">
                                                <tr>
                                                    <th className="p-2 border-r">Waktu</th>
                                                    <th className="p-2 border-r">NISN</th>
                                                    <th className="p-2 border-r">Nama</th>
                                                    <th className="p-2 border-r">Tugas</th>
                                                    <th className="p-2 border-r text-center">Nilai</th>
                                                    <th className="p-2 border-r text-center">Cheat</th>
                                                    <th className="p-2">Tindakan</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {(!results || results.length === 0) ? (
                                                    <tr><td colSpan="7" className="p-6 text-center text-gray-400">Belum ada data masuk.</td></tr>
                                                ) : (
                                                    results.slice().reverse().map((r, idx) => (
                                                        <ResultRow key={`${r.nisn}-${r.ujian}-${idx}`} r={r} onUpdateCatatan={onUpdateCatatan} />
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'materi' && (
                                <div className="space-y-6 animate-in pb-10">
                                    <div className="bg-white border border-gray-300 shadow-sm">
                                        <div className="bg-teal-600 text-white p-3 font-semibold text-sm">Tambah Materi Baru</div>
                                        <div className="p-4">
                                            <form onSubmit={handleAddMateri} className="space-y-4">
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Mata Pelajaran</label>
                                                        <select name="mapel" required className="w-full p-2 border border-gray-300 text-sm outline-none cursor-pointer">
                                                            <option value="">-- Pilih Mapel --</option>
                                                            {MAPEL_LIST.map((m, idx) => <option key={idx} value={m}>{m}</option>)}
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Judul Materi</label>
                                                        <input type="text" name="judul" placeholder="Contoh: Sistem Tata Surya" required className="w-full p-2 border border-gray-300 text-sm outline-none" />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Link PDF (Modul)</label>
                                                        <input type="url" name="pdf" placeholder="https://..." className="w-full p-2 border border-gray-300 text-sm outline-none font-mono text-blue-600" />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Link Sampul (Gambar)</label>
                                                        <input type="url" name="gambar" placeholder="https://..." className="w-full p-2 border border-gray-300 text-sm outline-none font-mono text-blue-600" />
                                                    </div>

                                                    {/* TAMBAHAN DROPDOWN PILIHAN UJIAN TERKAIT DI SINI */}
                                                    <div className="md:col-span-2">
                                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Hubungkan dengan Tugas Ujian (Opsional)</label>
                                                        <select name="linkedExamId" className="w-full p-2 border border-gray-300 text-sm outline-none cursor-pointer bg-white">
                                                            <option value="">-- Pilih Tugas Ujian Terkait --</option>
                                                            {exams.map((ex, idx) => (
                                                                <option key={idx} value={ex.id}>{ex.title} (ID: {ex.id})</option>
                                                            ))}
                                                        </select>
                                                        <p className="text-[10px] text-slate-500 mt-1">Siswa akan melihat tombol "Kerjakan Soal" yang langsung mengarah ke ujian ini setelah membuka materi.</p>
                                                    </div>
                                                </div>

                                                <button type="submit" disabled={loadingMateri} className="px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-sm font-bold shadow-sm cursor-pointer transition-colors">
                                                    {loadingMateri ? 'Menyimpan...' : 'Simpan & Publikasikan Materi'}
                                                </button>
                                            </form>
                                        </div>
                                    </div>

                                    {/* DAFTAR MATERI AKTIF (ETALASE) */}
                                    <div className="bg-white border border-gray-300 shadow-sm p-4">
                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4 border-b border-gray-200 pb-3">
                                            <h3 className="font-bold text-gray-800 text-sm flex items-center gap-2">
                                                <Icon name="list" size={18} className="text-teal-600"/> 
                                                Daftar Materi Aktif ({filteredMateriList.length})
                                            </h3>
                                            <div className="w-full sm:w-auto">
                                                <select 
                                                    value={selectedMateriMapelFilter} 
                                                    onChange={(e) => setSelectedMateriMapelFilter(e.target.value)}
                                                    className="w-full sm:w-auto px-3 py-1.5 border border-gray-300 text-xs font-semibold bg-white outline-none cursor-pointer"
                                                >
                                                    <option value="ALL">Semua Mapel</option>
                                                    {MAPEL_LIST.map((m, idx) => (
                                                        <option key={idx} value={m}>{m}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {filteredMateriList.length === 0 ? (
                                                <p className="col-span-full text-center text-gray-400 text-sm py-6 italic">Belum ada materi yang ditambahkan.</p>
                                            ) : (
                                                filteredMateriList.map((item, idx) => (
                                                    <div key={idx} className="p-3 bg-gray-50 border border-gray-200 rounded-lg flex items-center gap-3 shadow-sm">
                                                        <img 
                                                            src={item.gambar || 'https://via.placeholder.com/80?text=Img'} 
                                                            alt={item.judul} 
                                                            className="w-14 h-16 rounded object-cover border shrink-0 bg-white"
                                                            onError={(e) => { e.target.onerror = null; e.target.src = 'https://via.placeholder.com/80?text=Img'; }}
                                                        />
                                                        <div className="flex-1 min-w-0">
                                                            <span className="inline-block px-2 py-0.5 bg-teal-100 text-teal-800 text-[10px] font-bold rounded mb-1">{item.mapel}</span>
                                                            <h4 className="font-bold text-gray-800 text-xs truncate">{item.judul}</h4>
                                                            {item.pdf && (
                                                                <a href={item.pdf} target="_blank" rel="noopener noreferrer" className="mt-2 inline-block text-[11px] text-blue-600 hover:underline font-semibold">
                                                                    🔗 Buka File PDF
                                                                </a>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('admin-root')).render(<AdminApp />);
    </script>
</body>
</html>
