                            <div className="text-right hidden sm:block">
                                <p className="text-[10px] text-blue-200 uppercase">Selamat datang</p>
                                <p className="text-xs font-bold">{currentUser.nama}</p>
                            </div>
                            <div className="bg-blue-800/80 px-3 py-1.5 rounded-lg border border-blue-700 text-xs font-bold flex items-center gap-1.5">
                                <span>👤</span>
                                {/* Teks "SISWA" bisa dihilangkan atau diganti ikon saja agar di HP super rapi */}
                                <span className="hidden sm:inline">SISWA</span>
                            </div>
                        </div>
                    </header>

                    {/* --- MODAL PELANGGARAN / KECURANGAN --- */}
                    {showCheatModal && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center border-t-8 border-red-600">
                                <h3 className="text-2xl font-black text-slate-800 mb-2 uppercase">Peringatan Keras!</h3>
                                <p className="text-slate-600 text-sm mb-4">Dilarang meninggalkan halaman ujian.</p>
                                <div className="bg-red-50 text-red-800 p-3 rounded-lg mb-6 font-bold">Pelanggaranmu: {cheatWarningCount} Kali</div>
                                <button onClick={() => setShowCheatModal(false)} className="w-full py-3.5 rounded-xl font-bold bg-red-600 text-white shadow-lg cursor-pointer">KEMBALI</button>
                            </div>
                        </div>
                    )}

                    {/* --- CUSTOM MODAL KONFIRMASI KUMPULKAN / HENTIKAN UJIAN --- */}
                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-left border border-slate-100">
                                <h3 className="text-xl font-bold text-slate-800 mb-2">Konfirmasi Pengerjaan Soal</h3>
                                <p className="text-slate-600 text-sm mb-4">Apa kamu yakin ingin mengakhiri dan mengirim jawaban?</p>
                                
                                {(unansweredCount > 0 || raguCount > 0) && (
                                    <div className="bg-amber-50 border border-amber-200 p-3.5 rounded-xl mb-5 text-xs space-y-1 text-amber-800 font-medium">
                                        <p className="font-bold mb-1">Perhatian:</p>
                                        {unansweredCount > 0 && <p>• Masih ada <strong>{unansweredCount} soal</strong> belum dijawab.</p>}
                                        {raguCount > 0 && <p>• Masih ada <strong>{raguCount} soal</strong> berstatus ragu-ragu.</p>}
                                    </div>
                                )}

                                <div className="flex gap-3 pt-2">
                                    <button onClick={() => setShowConfirmModal(false)} className="flex-1 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs cursor-pointer transition-colors">Kembali Mengerjakan</button>
                                    <button onClick={submitExam} className="flex-1 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs cursor-pointer shadow-md transition-colors">Ya, Kirimkan</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- KONTEN UTAMA HALAMAN UJIAN (GRID 4 KOLOM) --- */}
                    <main className="flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 max-w-7xl mx-auto w-full items-start">
                        
                        {/* Kolom Kiri & Tengah (Lembar Soal + Navigasi Bawah) */}
                        <div className="lg:col-span-3 flex flex-col gap-4">
                            <div className="bg-white rounded-2xl shadow-sm border p-6 flex flex-col">
                                <div className="border-b pb-3 mb-4 flex justify-between items-center">
                                    <span className="bg-blue-900 text-white text-xs font-bold px-3.5 py-1.5 rounded-lg flex items-center gap-2 shadow-sm">
                                        SOAL NO. {currentQIndex + 1} <span className={`px-1.5 py-0.5 rounded text-[10px] font-extrabold ${isEssayQuestion ? 'bg-amber-500 text-white' : 'bg-blue-600 text-white border border-blue-400'}`}>
        {isEssayQuestion ? 'ESSAY' : 'PG'}</span>
                                    </span>
                                    <div className="lg:hidden font-mono font-bold text-blue-700 text-xs bg-blue-50 px-3 py-1 rounded-lg border border-blue-100">
                                        SISA WAKTU: {formatTime(timeLeft)}
                                    </div>
                                </div>
                                
                                <div className="flex-1 text-base md:text-lg overflow-y-auto mb-6">
                                    <div className="mb-6 leading-relaxed font-medium text-slate-800">{renderContent(question.text)}</div>
                                    
                                    {isEssayQuestion ? (
                                        <div className="mt-4">
                                            <label className="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">Jawaban:</label>
                                            <textarea 
                                                className="w-full p-4 border-2 border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 text-base min-h-[180px] transition-all resize-y"
                                                placeholder="Ketik uraian jawaban Anda di sini secara lengkap..."
                                                value={answers[question.id] || ''}
                                                onChange={(e) => handleAnswer(question.id, e.target.value)}
                                                autoFocus
                                            ></textarea>
                                        </div>
                                    ) : (
                                        <div className="space-y-3">
                                            {question.options.map((opt, idx) => (
                                                <label key={idx} className={`flex items-start gap-4 p-4 rounded-xl border-2 cursor-pointer transition-all ${answers[question.id] === idx ? 'border-blue-500 bg-blue-50' : 'border-slate-200 hover:border-blue-300'}`}>
                                                    <input type="radio" name={`q-${question.id}`} checked={answers[question.id] === idx} onChange={() => handleAnswer(question.id, idx)} className="w-5 h-5 mt-1 text-blue-600" />
                                                    <div className="flex-1 text-base text-slate-700">{renderContent(opt)}</div>
                                                </label>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Tombol Navigasi Bawah (Sebelumnya, Ragu-ragu, Selanjutnya) */}
                            <div className="flex justify-between items-center bg-white p-4 rounded-2xl border shadow-sm gap-2">
                                <button onClick={() => setCurrentQIndex(prev => Math.max(0, prev - 1))} disabled={currentQIndex === 0} className="px-4 py-2.5 text-xs font-bold rounded-xl bg-slate-200 text-slate-700 disabled:opacity-40 cursor-pointer flex items-center gap-1 hover:bg-slate-300 transition-colors">
                                    <Icon name="chevron-left" size={16}/> SEBELUMNYA
                                </button>
                                
                                <button onClick={handleToggleRaguRagu} className={`px-4 py-2.5 rounded-xl text-xs font-bold cursor-pointer transition-colors shadow-sm ${raguRaguSet.has(currentQIndex) ? 'bg-amber-600 text-white' : 'bg-amber-500 hover:bg-amber-600 text-white'}`}>
                                    {raguRaguSet.has(currentQIndex) ? 'BATAL RAGU' : 'RAGU-RAGU'}
                                </button>

                                {currentQIndex === shuffledQuestions.length - 1 ? (
                                    <button onClick={() => setShowConfirmModal(true)} className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold cursor-pointer shadow-sm">
                                        SELESAI
                                    </button>
                                ) : (
                                    <button onClick={() => setCurrentQIndex(prev => Math.min(shuffledQuestions.length - 1, prev + 1))} className="px-4 py-2.5 text-white bg-blue-600 hover:bg-blue-700 rounded-xl text-xs font-bold cursor-pointer shadow-sm flex items-center gap-1">
                                        SELANJUTNYA <Icon name="chevron-right" size={16}/>
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Kolom Kanan (Panel Sisa Waktu, Nomor Soal, & Tombol Hentikan Ujian) */}
                        <div className="w-full flex flex-col gap-4">
                            {/* Kotak Sisa Waktu Desktop */}
                            <div className="hidden lg:flex bg-white p-5 rounded-2xl shadow-sm border flex-col items-center justify-center">
                                <span className="text-slate-500 text-xs mb-1 font-bold uppercase tracking-wider">Sisa Waktu</span>
                                <div className={`text-3xl font-mono font-black ${timeLeft < 300 ? 'text-red-600 animate-pulse' : 'text-slate-800'}`}>{formatTime(timeLeft)}</div>
                            </div>

                            {/* Panel Palet Nomor Soal */}
                            <div className="bg-white p-5 rounded-2xl shadow-sm border flex flex-col justify-between">
                                <div>
                                    <h3 className="font-bold text-xs mb-4 text-slate-700 border-b pb-2 uppercase tracking-wider">Nomor Soal</h3>
                                    <div className="grid grid-cols-5 gap-2">
                                        {shuffledQuestions.map((q, idx) => {
                                            const ans = answers[q.id];
                                            const isAnswered = (q.options && q.options.length > 0) ? (ans !== undefined) : (ans && ans.toString().trim() !== '');
                                            const isRagu = raguRaguSet.has(idx);
                                            const isCurrent = currentQIndex === idx;

                                            // Aturan warna indikator
                                            let bgClass = "bg-slate-200 text-slate-600 border-slate-300"; // Belum dijawab
                                            if (isAnswered) bgClass = "bg-emerald-500 text-white border-emerald-600"; // Sudah dijawab
                                            if (isRagu) bgClass = "bg-amber-500 text-white border-amber-600"; // Ragu-ragu

                                            return (
                                                <button 
                                                    key={q.id} 
                                                    onClick={() => setCurrentQIndex(idx)} 
                                                    className={`h-10 rounded-xl text-xs font-bold border-2 cursor-pointer transition-all flex items-center justify-center ${bgClass} ${isCurrent ? 'ring-4 ring-blue-400/50 scale-105' : ''}`}
                                                >
                                                    {idx + 1}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Tombol Hentikan Ujian di Bawah Panel Kanan */}
                                <div className="mt-6 pt-4 border-t border-slate-100">
                                    <button 
                                        onClick={() => setShowConfirmModal(true)} 
                                        className="w-full py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold tracking-wider shadow-sm transition-colors cursor-pointer uppercase"
                                    >
                                        SELESAI
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        function NoteModal({ r, onClose, onSave }) {
            const [text, setText] = useState(r.catatan || "");

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave(r.nisn, r.ujian, text);
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 animate-in border border-slate-100">
                        <div className="flex justify-between items-center mb-4 border-b pb-3">
                            <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">

        function GameAdminPanel({ games = [], gameResults = [], exams = [] }) {
            const [form, setForm] = useState({ id: '', type: 'match', mapel: MAPEL_LIST[0], title: '', duration: 3, linkedExamId: '', pairsText: '[{"left":"Akar","right":"Menyerap air"}]' });
            const [saving, setSaving] = useState(false);
            const [aiFiles, setAiFiles] = useState([]);
            const [aiLoading, setAiLoading] = useState(false);
            const [filter, setFilter] = useState('ALL');

            const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

            const handleAiFiles = (e) => {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;
                let loaded = [];
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        loaded.push({ name: file.name, mimeType: file.type, base64: String(ev.target.result).split(',')[1] });
                        if (loaded.length === files.length) setAiFiles(prev => [...prev, ...loaded]);
                    };
                    reader.readAsDataURL(file);
                });
            };

            const handleGeneratePairs = async () => {
                if (!aiFiles.length) { alert("Unggah materi dulu."); return; }
                setAiLoading(true);
                try {
                    const res = await fetch(WEB_APP_URL, {
                        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "generateGamePairs", files: aiFiles, mapel: form.mapel, gameType: form.type })
                    });
                    const out = await res.json();
                    if (out.status === "success" && out.pairs) {
                        set('pairsText', JSON.stringify(out.pairs, null, 1));
                        alert("AI membuat " + out.pairs.length + " pasangan. Tinjau lalu simpan.");
                    } else throw new Error(out.message || "Gagal");
                } catch (err) { alert("Gagal generate: " + err.message); }
                finally { setAiLoading(false); }
            };

            const handleSave = async (e) => {
                e.preventDefault();
                let pairs;
                try { pairs = JSON.parse(form.pairsText); if (!Array.isArray(pairs) || !pairs.length) throw new Error("kosong"); }
                catch (err) { alert("pairsText harus JSON array, contoh: [{\"left\":\"A\",\"right\":\"B\"}]"); return; }
                const gid = form.id.trim() || (`game-${form.type}-${Date.now().toString().slice(-5)}`);
                setSaving(true);
                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "saveGame", game: { id: gid, type: form.type, mapel: form.mapel, title: form.title || "Game Baru", duration: Number(form.duration) || 3, isActive: true, linkedExamId: form.linkedExamId, pairs } })
                    });
                    alert("Game tersimpan: " + gid);
                    window.location.reload();
                } catch (err) { alert("Gagal menyimpan: " + err.message); setSaving(false); }
            };

            const toggle = async (g) => {
                await fetch(WEB_APP_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "toggleGameStatus", gameId: g.id, isActive: false })
                });
                alert("Nonaktifkan via backend versi ini hanya mendukung matikan; aktifkan lagi dari sheet Games (kolom isActive=TRUE).");
                window.location.reload();
            };

            const shown = games.filter(g => filter === 'ALL' || g.mapel === filter);
            const topFor = (gid) => (gameResults || []).filter(r => r.gameId === gid).sort((a, b) => b.skor - a.skor).slice(0, 3);

            return (
                <div className="space-y-6">
                    <div className="bg-violet-50 border border-violet-200 p-4 rounded-2xl text-xs text-violet-800">
                        <strong>Game = latihan bonus.</strong> Hubungkan ke tugas formal via <em>linkedExamId</em> agar muncul di kartu tugas & materi. Skor game tidak mengubah nilai di <em>Hasil</em>.
                    </div>
                    <form onSubmit={handleSave} className="bg-white border rounded-2xl p-5 space-y-3 shadow-sm">
                        <h4 className="font-bold">Tambah / Update Game (manual + AI)</h4>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div><label className="text-xs font-bold">ID (kosongkan = otomatis)</label><input value={form.id} onChange={e => set('id', e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" placeholder="match-mtk-02" /></div>
                            <div><label className="text-xs font-bold">Tipe</label><select value={form.type} onChange={e => set('type', e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm"><option value="match">match</option><option value="memory">memory</option><option value="quizrush">quizrush</option><option value="balloon">balloon</option><option value="scramble">scramble</option><option value="snake">snake</option><option value="truefalse">truefalse</option><option value="hangman">hangman</option><option value="boss">boss</option><option value="sort">sort</option><option value="fillblank">fillblank</option><option value="race">race</option></select></div>
                            <div><label className="text-xs font-bold">Mapel</label><select value={form.mapel} onChange={e => set('mapel', e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm">{MAPEL_LIST.map(m => <option key={m} value={m}>{m}</option>)}</select></div>
                            <div className="md:col-span-2"><label className="text-xs font-bold">Judul</label><input value={form.title} onChange={e => set('title', e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" placeholder="Perkalian Cepat 2" /></div>
                            <div><label className="text-xs font-bold">Durasi (mnt)</label><input type="number" value={form.duration} onChange={e => set('duration', e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" /></div>
                            <div className="md:col-span-3"><label className="text-xs font-bold">Hubungkan ke Tugas (opsional)</label><select value={form.linkedExamId} onChange={e => set('linkedExamId', e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm"><option value="">-- Bebas (Zona Game saja) --</option>{exams.map(ex => <option key={ex.id} value={ex.id}>{ex.title} ({ex.id})</option>)}</select></div>
                        </div>
                        <div><label className="text-xs font-bold">Pairs JSON</label><textarea rows="4" value={form.pairsText} onChange={e => set('pairsText', e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs font-mono" /></div>
                        <div className="flex flex-wrap gap-2 items-center">
                            <input type="file" multiple accept="image/jpeg,image/png,application/pdf" onChange={handleAiFiles} className="text-xs" />
                            <button type="button" onClick={handleGeneratePairs} disabled={aiLoading || !aiFiles.length} className="px-3 py-2 bg-violet-600 text-white rounded-xl text-xs font-bold disabled:opacity-40 cursor-pointer">{aiLoading ? "AI..." : "✨ Generate pairs AI"}</button>
                            <span className="text-[11px] text-slate-500">{aiFiles.length} file</span>
                            <button type="submit" disabled={saving} className="ml-auto px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold cursor-pointer">{saving ? "Menyimpan..." : "Simpan Game"}</button>
                        </div>
                    </form>
                    <div className="flex gap-2 items-center">
                        <select value={filter} onChange={e => setFilter(e.target.value)} className="px-3 py-2 border rounded-xl text-xs"><option value="ALL">Semua mapel</option>{MAPEL_LIST.map(m => <option key={m} value={m}>{m}</option>)}</select>
                        <span className="text-xs text-slate-500">{shown.length} game</span>
                    </div>
                    <div className="space-y-2">
                        {shown.map(g => (
                            <div key={g.id} className="bg-white border rounded-xl p-4 flex flex-col sm:flex-row gap-3 justify-between">
                                <div><p className="font-bold text-sm">{g.title} <span className="text-[10px] bg-violet-100 text-violet-700 px-2 py-0.5 rounded-full ml-1">{g.type}</span></p><p className="text-xs text-slate-500">{g.id} · {g.mapel} · {(g.pairs || []).length} pasangan{ g.linkedExamId ? ` · 🔗 ${g.linkedExamId}` : ""}</p>
                                {topFor(g.id).length > 0 && <p className="text-[11px] text-amber-600 mt-1">🏆 {topFor(g.id).map(t => `${t.nama}:${t.skor}`).join(" · ")}</p>}</div>
                                <div className="flex gap-2 items-start">
                                    <button onClick={() => setForm({ id: g.id, type: g.type, mapel: g.mapel, title: g.title, duration: g.duration, linkedExamId: g.linkedExamId || '', pairsText: JSON.stringify(g.pairs || [], null, 1) })} className="px-3 py-1.5 bg-slate-100 rounded-lg text-xs font-bold cursor-pointer">Edit</button>
                                    <button onClick={() => toggle(g)} className="px-3 py-1.5 bg-red-50 text-red-600 rounded-lg text-xs font-bold cursor-pointer">Matikan</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function AdminDashboard({ exams, results, students, materiList, games = [], gameResults = [], onToggleStatus, onUpdateCatatan }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [loadingMateri, setLoadingMateri] = useState(false);

            // State khusus untuk fitur AI Generator Soal
            const [aiMapel, setAiMapel] = useState(MAPEL_LIST[0]);
            const [aiFiles, setAiFiles] = useState([]);
            const [aiLoading, setAiLoading] = useState(false);
            const [aiGeneratedQuestions, setAiGeneratedQuestions] = useState([]);
            const [examTitle, setExamTitle] = useState('');
            const [examDuration, setExamDuration] = useState('30');
            const [isPublishing, setIsPublishing] = useState(false);

            const [selectedFilterStatus, setSelectedFilterStatus] = useState('ALL'); 
            const [selectedExamFilter, setSelectedExamFilter] = useState(exams.length > 0 ? exams[0].title : '');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedMapelFilter, setSelectedMapelFilter] = useState('ALL');

            const [selectedMateriMapelFilter, setSelectedMateriMapelFilter] = useState('ALL');

            // Handler unggah file multi-file untuk AI
            const handleFileChange = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                let loadedFiles = [];
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (uploadEvent) => {
                        const base64String = uploadEvent.target.result.split(',')[1];
                        loadedFiles.push({
                            name: file.name,
                            mimeType: file.type,
                            base64: base64String
                        });
                        if (loadedFiles.length === files.length) {
                            setAiFiles(prev => [...prev, ...loadedFiles]);
                        }
                    };
                    reader.readAsDataURL(file);
                });
            };

            const removeAiFile = (index) => {
                setAiFiles(prev => prev.filter((_, i) => i !== index));
            };

            // Proses kirim ke backend Apps Script (Gemini AI) via Web App URL
            const handleGenerateAI = async () => {
                if (aiFiles.length === 0) {
                    alert("Silakan unggah minimal 1 file materi (JPG/PNG/PDF) terlebih dahulu.");
                    return;
                }

                setAiLoading(true);
                setAiGeneratedQuestions([]);

                try {
                    // Menggunakan fetch POST ke WEB_APP_URL agar bisa diakses dari GitHub Pages
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: "generateAIQuestions",
                            files: aiFiles,
                            mapel: aiMapel
                        })
                    });

                    const result = await response.json();
                    if (result.status === "success" && result.questions) {
                        setAiGeneratedQuestions(result.questions);
                        setAiLoading(false);
                        alert("Berhasil! AI telah membuat " + result.questions.length + " soal. Silakan tinjau di bawah.");
                    } else {
                        throw new Error(result.message || "Gagal memproses AI dari server.");
                    }
                } catch (error) {
                    alert("Terjadi kesalahan: " + error.message);
                    setAiLoading(false);
                }
            };

            // Handler edit pertanyaan hasil AI sebelum disimpan
            const handleQuestionChange = (index, field, value) => {
                const updated = [...aiGeneratedQuestions];
                updated[index][field] = value;
                setAiGeneratedQuestions(updated);
            };

            const handleOptionChange = (qIndex, optIndex, value) => {
                const updated = [...aiGeneratedQuestions];
                updated[qIndex].options[optIndex] = value;
                setAiGeneratedQuestions(updated);
            };

            // Simpan soal ke Spreadsheet sebagai Tugas baru
            const handlePublishAiExam = async () => {
                if (!examTitle.trim()) {
                    alert("Topik/Judul khusus wajib diisi (contoh: Tata Surya).");
                    return;
                }
                if (aiGeneratedQuestions.length === 0) {
                    alert("Belum ada soal yang tersedia.");
                    return;
                }

                setIsPublishing(true);

                // Aturan 1: exam_id -> kode mapel_DDMM (contoh: IPAS_3008)
                const now = new Date();
                const dd = String(now.getDate()).padStart(2, '0');
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const mapelCode = aiMapel.replace(/[^a-zA-Z0-9]/g, "").toUpperCase(); // Ambil huruf/angka bersih untuk kode
                const examIdGenerated = `${mapelCode}_${dd}${mm}`;

                // Aturan 2: title -> awalan mapel dan topik (contoh: PR IPAS - Tata Surya)
                const finalTitle = `PR ${aiMapel} - ${examTitle}`;

                // Aturan 3: duration -> 1 soal 1 menit (jika 30 soal, maka 30 menit)
                const totalSoal = aiGeneratedQuestions.length;
                const calculatedDuration = totalSoal; 

                // Aturan 4 & 5: isActive TRUE, q_id diurutkan dari 1 s.d. jumlah soal (misal 30)
                const formattedQuestions = aiGeneratedQuestions.slice(0, 30).map((q, index) => ({
                    q_id: index + 1, // Aturan 5: selalu dari 1 s.d. 30 (atau sejumlah soal)
                    text: q.text,
                    options: q.options,
                    answer: q.answer
                }));

                const newExamData = {
                    action: "saveNewExam",
                    id: examIdGenerated,       // Aturan 1
                    title: finalTitle,         // Aturan 2
                    duration: calculatedDuration, // Aturan 3
                    isActive: true,            // Aturan 4
                    questions: formattedQuestions
                };

                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newExamData)
                    });
                    alert("Tugas otomatis berhasil diterbitkan ke siswa dengan ID: " + examIdGenerated);
                    setIsPublishing(false);
                    window.location.reload();
                } catch (err) {
                    alert("Gagal menerbitkan tugas: " + err.message);
                    setIsPublishing(false);
                }
            };

            const handleAddMateri = async (e) => {
                e.preventDefault();
                const form = e.target;
                const mapel = form.mapel.value;
                const judul = form.judul.value;
                const pdf = form.pdf.value;
                const gambar = form.gambar.value;

                setLoadingMateri(true);
                try {
                    await google.script.run
                        .withSuccessHandler(() => {
                            alert("Materi berhasil ditambahkan!");
                            form.reset();
                            window.location.reload();
                        })
                        .withFailureHandler((err) => {
                            alert("Gagal menyimpan materi: " + err.message);
                            setLoadingMateri(false);
                        })
                        .addMateriToSheet({ mapel, judul, pdf, gambar });
                } catch (error) {
                    fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: "addMateri", mapel, judul, pdf, gambar })
                    });
                    alert("Permintaan simpan materi dikirim!");
                    setLoadingMateri(false);
                    form.reset();
                    window.location.reload();
                }
            };

            const totalStudents = students.length;
            const examResults = (results || []).filter(r => r.ujian === selectedExamFilter);
            const doneNisns = new Set(examResults.map(r => String(r.nisn)));
            
            const completedCount = doneNisns.size;
            const pendingCount = Math.max(0, totalStudents - completedCount);

            const studentStatusList = students.map(student => {
                const isDone = doneNisns.has(String(student.nisn));
                const res = examResults.find(r => String(r.nisn) === String(student.nisn));
                return {
                    ...student,
                    isDone,
                    nilai: isDone ? res.nilai : '-',
                    waktu: isDone ? res.waktu : '-',
                    pelanggaran: isDone ? res.pelanggaran : 0,
                    catatan: isDone ? res.catatan : ''
                };
            });

            const filteredStudents = studentStatusList.filter(s => {
                if (selectedFilterStatus === 'DONE' && !s.isDone) return false;
                if (selectedFilterStatus === 'PENDING' && s.isDone) return false;

                if (searchQuery.trim() !== '') {
                    const q = searchQuery.toLowerCase();
                    const matchName = s.name.toLowerCase().includes(q);
                    const matchNisn = String(s.nisn).toLowerCase().includes(q);
                    if (!matchName && !matchNisn) return false;
                }

                return true;
            });

            const filteredMateriList = (!materiList || materiList.length === 0) ? [] : materiList.filter(item => {
                if (selectedMateriMapelFilter === 'ALL') return true;
                return item.mapel === selectedMateriMapelFilter;
            });

            return (
                <div className="bg-white rounded-2xl shadow-sm border overflow-hidden flex flex-col md:flex-row min-h-[600px]">
                    <div className="w-full md:w-64 bg-slate-50 border-r p-4">
                        <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 px-3">Menu Guru</h2>
                        <nav className="space-y-1">
                            <button onClick={() => setActiveTab('overview')} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold cursor-pointer ${activeTab === 'overview' ? 'bg-blue-100 text-blue-700' : 'text-slate-600'}`}>📊 Pantau Siswa</button>
                            <button onClick={() => setActiveTab('ai-generator')} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold cursor-pointer ${activeTab === 'ai-generator' ? 'bg-blue-100 text-blue-700' : 'text-slate-600'}`}>🤖 Buat Soal AI</button>
                            <button onClick={() => setActiveTab('exams')} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold cursor-pointer ${activeTab === 'exams' ? 'bg-blue-100 text-blue-700' : 'text-slate-600'}`}>Kelola Status</button>
                            <button onClick={() => setActiveTab('games')} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold cursor-pointer ${activeTab === 'games' ? 'bg-blue-100 text-blue-700' : 'text-slate-600'}`}>🎮 Kelola Game</button>
                            <button onClick={() => setActiveTab('results')} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold cursor-pointer ${activeTab === 'results' ? 'bg-blue-100 text-blue-700' : 'text-slate-600'}`}>Rekap Nilai</button>
                            <button onClick={() => setActiveTab('materi')} className={`w-full text-left px-3 py-2.5 rounded-xl text-sm font-semibold cursor-pointer ${activeTab === 'materi' ? 'bg-blue-100 text-blue-700' : 'text-slate-600'}`}>Kelola Materi</button>
                        </nav>
                    </div>
                    <div className="flex-1 p-6 overflow-y-auto">
                        {activeTab === 'overview' && (
                            <div className="space-y-6">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-50 p-4 rounded-2xl border">
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-800">Review Pengerjaan Tugas</h3>
                                        <p className="text-xs text-slate-500">Pilih tugas/ujian, mapel, atau cari nama siswa untuk melihat status.</p>
                                    </div>
                                    <div className="w-full sm:w-auto">
                                        <select 
                                            value={selectedExamFilter} 
                                            onChange={(e) => setSelectedExamFilter(e.target.value)}
                                            className="w-full sm:w-auto px-3.5 py-2 border rounded-xl text-xs font-bold bg-white outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
                                        >
                                            {exams.map((ex, idx) => (
                                                <option key={idx} value={ex.title}>{ex.title}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Cari Nama / NISN Siswa</label>
                                        <input 
                                            type="text" 
                                            placeholder="Ketik nama atau NISN..." 
                                            value={searchQuery || ''}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full px-3.5 py-2 border rounded-xl text-xs bg-white outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">Mata Pelajaran</label>
                                        <select 
                                            value={selectedMapelFilter || 'ALL'}
                                            onChange={(e) => {
                                                const val = e.target.value;
                                                setSelectedMapelFilter(val);
                                                if(val !== 'ALL') {
                                                    const matchedExam = exams.find(ex => ex.title.toLowerCase().includes(val.toLowerCase()));
                                                    if(matchedExam) setSelectedExamFilter(matchedExam.title);
                                                }
                                            }}
                                            className="w-full px-3.5 py-2 border rounded-xl text-xs font-semibold bg-white outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
                                        >
                                            <option value="ALL">Semua Mapel</option>
                                            {MAPEL_LIST.map((m, idx) => (
                                                <option key={idx} value={m}>{m}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div 
                                        onClick={() => setSelectedFilterStatus('ALL')}
                                        className={`bg-white p-5 rounded-2xl shadow-sm border cursor-pointer transition-all hover:border-blue-400 ${selectedFilterStatus === 'ALL' ? 'ring-2 ring-blue-500 bg-blue-50/20' : 'border-slate-100'}`}
                                    >
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center font-bold">
                                                <Icon name="file-text" size={24} />
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-semibold uppercase">Total Siswa</p>
                                                <h3 className="text-2xl font-black text-slate-800">{totalStudents}</h3>
                                            </div>
                                        </div>
                                        <p className="text-[11px] text-blue-600 font-semibold mt-3">Lihat semua →</p>
                                    </div>

                                    <div 
                                        onClick={() => setSelectedFilterStatus('DONE')}
                                        className={`bg-white p-5 rounded-2xl shadow-sm border cursor-pointer transition-all hover:border-green-400 ${selectedFilterStatus === 'DONE' ? 'ring-2 ring-green-500 bg-green-50/20' : 'border-slate-100'}`}
                                    >
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 bg-green-50 text-green-600 rounded-xl flex items-center justify-center font-bold">
                                                <Icon name="check-circle" size={24} />
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-semibold uppercase">Sudah Mengerjakan</p>
                                                <h3 className="text-2xl font-black text-green-600">{completedCount}</h3>
                                            </div>
                                        </div>
                                        <p className="text-[11px] text-green-600 font-semibold mt-3">Lihat semua →</p>
                                    </div>

                                    <div 
                                        onClick={() => setSelectedFilterStatus('PENDING')}
                                        className={`bg-white p-5 rounded-2xl shadow-sm border cursor-pointer transition-all hover:border-amber-400 ${selectedFilterStatus === 'PENDING' ? 'ring-2 ring-amber-500 bg-amber-50/20' : 'border-slate-100'}`}
                                    >
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center font-bold">
                                                <Icon name="clock" size={24} />
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-semibold uppercase">Belum Mengerjakan</p>
                                                <h3 className="text-2xl font-black text-amber-600">{pendingCount}</h3>
                                            </div>
                                        </div>
                                        <p className="text-[11px] text-amber-600 font-semibold mt-3">Lihat semua →</p>
                                    </div>
                                </div>

                                <div className="bg-white border rounded-2xl overflow-hidden shadow-sm">
                                    <div className="p-4 bg-slate-50 border-b flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                        <h4 className="font-bold text-sm text-slate-700">
                                            Daftar Siswa ({selectedFilterStatus === 'ALL' ? 'Semua' : selectedFilterStatus === 'DONE' ? 'Sudah Selesai' : 'Belum Selesai'}) - <span className="text-blue-600">{selectedExamFilter}</span>
                                        </h4>
                                        {(selectedFilterStatus !== 'ALL' || searchQuery || (selectedMapelFilter && selectedMapelFilter !== 'ALL')) && (
                                            <button 
                                                onClick={() => { setSelectedFilterStatus('ALL'); setSearchQuery(''); setSelectedMapelFilter('ALL'); }} 
                                                className="text-xs text-blue-600 font-bold hover:underline cursor-pointer"
                                            >
                                                Reset 
                                            </button>
                                        )}
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-slate-50/50 border-b text-xs text-slate-500">
                                                <tr>
                                                    <th className="p-3">NISN</th>
                                                    <th className="p-3">Nama Siswa</th>
                                                    <th className="p-3 text-center">Status Pengerjaan</th>
                                                    <th className="p-3 text-center">Nilai</th>
                                                    <th className="p-3">Waktu Pengumpulan</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {filteredStudents.length === 0 ? (
                                                    <tr><td colSpan="5" className="p-6 text-center text-slate-400">Tidak ada data siswa yang sesuai.</td></tr>
                                                ) : (
                                                    filteredStudents.map((s, idx) => (
                                                        <tr key={idx} className="border-b hover:bg-slate-50/50">
                                                            <td className="p-3 font-mono text-xs">{s.nisn}</td>
                                                            <td className="p-3 font-bold text-slate-800">{s.name}</td>
                                                            <td className="p-3 text-center">
                                                                {s.isDone ? (
                                                                    <span className="px-2.5 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full inline-block">Sudah Selesai</span>
                                                                ) : (
                                                                    <span className="px-2.5 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-full inline-block">Belum Mengerjakan</span>
                                                                )}
                                                            </td>
                                                            <td className="p-3 text-center font-black text-blue-600">{s.nilai}</td>
                                                            <td className="p-3 text-xs text-slate-500">{s.waktu}</td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 p-5 rounded-2xl">
                                    <h3 className="text-lg font-bold text-blue-900 flex items-center gap-2">
                                        🤖 Generator Soal Otomatis Berbasis AI
                                    </h3>
                                    <p className="text-xs text-blue-700 mt-1">
                                        Unggah beberapa foto materi pelajaran (JPG/PNG). AI akan otomatis membacanya dan merumuskan soal pilihan ganda berkualitas tinggi untuk siswa Anda.
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Pilih Mata Pelajaran</label>
                                        <select 
                                            value={aiMapel} 
                                            onChange={(e) => setAiMapel(e.target.value)}
                                            className="w-full px-3.5 py-2.5 border rounded-xl text-sm font-semibold bg-white outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
                                        >
                                            {MAPEL_LIST.map((m, idx) => (
                                                <option key={idx} value={m}>{m}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">Unggah File Materi (Bisa Banyak Sekaligus)</label>

                                            type="file" 
                                            multiple 
                                            accept="image/jpeg,image/png,application/pdf" 
                                            onChange={handleFileChange}
                                            className="w-full px-3 py-2 border rounded-xl text-xs bg-white file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
                                        />
                                    </div>
                                </div>

                                {/* Daftar Pratinjau File yang Diunggah */}
                                {aiFiles.length > 0 && (

                                        <label className="block text-xs font-bold text-slate-600">File Terpilih ({aiFiles.length}):</label>

                                            {aiFiles.map((file, idx) => (
                                                <div key={idx} className="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-xl border text-xs font-medium">
                                                    <span className="truncate max-w-[180px]">{file.name}</span>
                                                    <button onClick={() => removeAiFile(idx)} className="text-red-500 hover:text-red-700 font-bold cursor-pointer">×</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <button 
                                    onClick={handleGenerateAI}
                                    disabled={aiLoading || aiFiles.length === 0}
                                    className="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-bold text-sm rounded-xl transition-colors shadow-sm cursor-pointer disabled:cursor-not-allowed flex items-center justify-center gap-2"
                                >
                                    {aiLoading ? (
                                        <>
                                            <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                            <span>AI Sedang Menganalisis Materi & Membuat Soal...</span>
                                        </>
                                    ) : (
                                        <>✨ Proses & Buat Soal dengan AI</>
                                    )}
                                </button>

                                {/* Area Review Hasil Soal AI */}
                                {aiGeneratedQuestions.length > 0 && (
                                    <div className="mt-8 space-y-6 border-t pt-6">
                                        <div className="bg-slate-50 p-4 rounded-2xl border space-y-4">

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 mb-1">Judul Tugas / Ujian</label>
                                                    <input 
                                                        type="text" 
                                                        value={examTitle} 
                                                        onChange={(e) => setExamTitle(e.target.value)} 
                                                        placeholder="Contoh: Latihan Bab 1 Pecahan" 
                                                        className="w-full px-3.5 py-2 border rounded-xl text-sm bg-white"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-700 mb-1">Durasi (Menit)</label>
                                                    <input 
                                                        type="number" 
                                                        value={examDuration} 
                                                        onChange={(e) => setExamDuration(e.target.value)} 
                                                        className="w-full px-3.5 py-2 border rounded-xl text-sm bg-white"
                                                    />
                                                </div>
                                            </div>
                                        </div>

                                        <h4 className="font-bold text-base text-slate-800">Review Hasil Soal AI ({aiGeneratedQuestions.length} Soal)</h4>
                                        <p className="text-xs text-slate-500">Anda dapat mengedit teks soal atau pilihan jawaban jika ada yang perlu disesuaikan sebelum diterbitkan.</p>

                                        <div className="space-y-4">
                                            {aiGeneratedQuestions.map((q, qIdx) => (
                                                <div key={qIdx} className="bg-white p-5 rounded-2xl border shadow-sm space-y-3">
                                                    <div className="flex items-center justify-between">
                                                        <span className="text-xs font-bold bg-blue-100 text-blue-800 px-2.5 py-1 rounded-lg">Soal #{qIdx + 1}</span>
                                                    </div>
                                                    <div>
                                                        <label className="block text-[11px] font-bold text-slate-500 mb-1">Pertanyaan</label>
                                                        <textarea 
                                                            rows="2" 
                                                            value={q.text} 
                                                            onChange={(e) => handleQuestionChange(qIdx, 'text', e.target.value)}
                                                            className="w-full px-3 py-2 border rounded-xl text-sm font-medium bg-slate-50 focus:bg-white"
                                                        ></textarea>
                                                    </div>

                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                        {q.options.map((opt, optIdx) => (
                                                            <div key={optIdx} className="flex items-center gap-2">
                                                                <span className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shrink-0 ${q.answer === optIdx ? 'bg-green-600 text-white' : 'bg-slate-200 text-slate-700'}`}>
                                                                    {['A', 'B', 'C', 'D'][optIdx]}
                                                                </span>
                                                                <input 
                                                                    type="text" 
                                                                    value={opt} 
                                                                    onChange={(e) => handleOptionChange(qIdx, optIdx, e.target.value)}
                                                                    className="w-full px-3 py-1.5 border rounded-xl text-xs bg-slate-50 focus:bg-white"
                                                                />
                                                            </div>
                                                        ))}
                                                    </div>

                                                    <div className="text-xs text-green-700 bg-green-50 px-3 py-2 rounded-xl border border-green-200 flex items-center justify-between">
                                                        <span>Kunci Jawaban Benar: <strong>Pilihan {['A', 'B', 'C', 'D'][q.answer]}</strong></span>
                                                        <select 
                                                            value={q.answer} 
                                                            onChange={(e) => handleQuestionChange(qIdx, 'answer', Number(e.target.value))}
                                                            className="px-2 py-1 border rounded-lg text-xs font-bold bg-white cursor-pointer"
                                                        >
                                                            <option value={0}>A</option>
                                                            <option value={1}>B</option>
                                                            <option value={2}>C</option>
                                                            <option value={3}>D</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <button 
                                            onClick={handlePublishAiExam}
                                            disabled={isPublishing}
                                            className="w-full py-3.5 bg-green-600 hover:bg-green-700 disabled:bg-slate-300 text-white font-bold text-sm rounded-xl transition-colors shadow-md cursor-pointer flex items-center justify-center gap-2"
                                        >
                                            {isPublishing ? 'Menerbitkan Tugas...' : '🚀 ACC & Terbitkan Tugas ke Siswa'}
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'exams' && (
                            <div>
                                <h3 className="text-lg font-bold mb-2">Kelola Status</h3>
                                <p className="text-xs text-slate-500 mb-6">Klik tombol status untuk mengaktifkan atau menonaktifkan tugas.</p>
                                <div className="space-y-3">
                                    {exams.map(e => (
                                        <div key={e.id} className="border p-4 rounded-xl bg-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-sm">
                                            <div>
                                                <h4 className="font-bold text-slate-800">{e.title}</h4>
                                                <p className="text-xs text-slate-500">ID: {e.id} | {e.questions.length} Soal | {e.duration} Menit</p>
                                            </div>
                                            <button 
                                                onClick={() => onToggleStatus(e.id)}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm cursor-pointer ${e.isActive ? 'bg-green-100 text-green-700 hover:bg-green-200 border border-green-300' : 'bg-slate-100 text-slate-500 hover:bg-slate-200 border border-slate-300'}`}
                                            >
                                                {e.isActive ? '🟢 AKTIF (Klik untuk Matikan)' : '⚪ NON-AKTIF (Klik untuk Aktifkan)'}
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        {activeTab === 'games' && (
                            <div>
                                <h3 className="text-lg font-bold mb-2">Kelola Game Bonus</h3>
                                <p className="text-xs text-slate-500 mb-4">Buat manual atau via AI, hubungkan ke tugas agar muncul sebagai latihan bonus.</p>
                                <GameAdminPanel games={games} gameResults={gameResults} exams={exams} />
                            </div>
                        )}
                        {activeTab === 'results' && (
                            <div>
                                <h3 className="text-lg font-bold mb-2">Rekap Nilai & Catatan</h3>
                                <p className="text-xs text-slate-500 mb-4">Nilai formal dari tugas. Skor game bonus tampil terpisah di bawah.</p>
                                <div className="overflow-x-auto border rounded-xl bg-white">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-50 border-b">
                                            <tr>
                                                <th className="p-3">Waktu</th>
                                                <th className="p-3">NISN</th>
                                                <th className="p-3">Nama</th>
                                                <th className="p-3">Ujian</th>
                                                <th className="p-3 text-center">Nilai</th>
                                                <th className="p-3 text-center">Pelanggaran</th>
                                                <th className="p-3 w-72">Catatan</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {(!results || results.length === 0) ? (
                                                <tr><td colSpan="7" className="p-6 text-center text-slate-400">Belum ada data masuk.</td></tr>
                                            ) : (
                                                results.map((r, idx) => (
                                                    <ResultRow key={`${r.nisn}-${r.ujian}-${idx}`} r={r} onUpdateCatatan={onUpdateCatatan} />
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="mt-6 bg-violet-50 border border-violet-200 rounded-xl p-4">
                                    <h4 className="font-bold text-sm text-violet-800 mb-2">🎮 Skor Game Bonus (terpisah dari nilai formal, {(gameResults || []).length} catatan)</h4>
                                    {(gameResults || []).length === 0 ? (
                                        <p className="text-xs text-slate-500">Belum ada skor game.</p>
                                    ) : (
                                        <div className="overflow-x-auto bg-white rounded-lg border">
                                            <table className="w-full text-xs text-left">
                                                <thead className="bg-slate-50 border-b"><tr><th className="p-2">Waktu</th><th className="p-2">Nama</th><th className="p-2">Game</th><th className="p-2 text-center">Skor</th></tr></thead>
                                                <tbody>{gameResults.slice(-10).reverse().map((g, i) => (<tr key={i} className="border-b"><td className="p-2">{g.waktu}</td><td className="p-2 font-bold">{g.nama}</td><td className="p-2">{g.game}</td><td className="p-2 text-center font-black text-violet-600">{g.skor}</td></tr>))}</tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                        {activeTab === 'materi' && (
                            <div className="space-y-6">
                                <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                                    <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                                        <Icon name="book-open" size={18} className="text-blue-600"/> 
                                        Tambah Materi Baru
                                    </h3>
                                    <form onSubmit={handleAddMateri} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-700 mb-1">Mata Pelajaran</label>
                                            <select 
                                                name="mapel" 
                                                required 
                                                className="w-full px-3.5 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white cursor-pointer"
                                            >
                                                <option value="">-- Pilih Mapel --</option>
                                                {MAPEL_LIST.map((m, idx) => (
                                                    <option key={idx} value={m}>{m}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-700 mb-1">Judul Materi</label>
                                            <input 
                                                type="text" 
                                                name="judul" 
                                                required 
                                                placeholder="Contoh: Pecahan Desimal" 
                                                className="w-full px-3.5 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white"
                                            />
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-medium text-slate-700 mb-1">Link File</label>
                                                <input 
                                                    type="url" 
                                                    name="pdf" 
                                                    placeholder="Tempel link disini..." 
                                                    className="w-full px-3.5 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm font-mono bg-white"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-slate-700 mb-1">Link Cover</label>
                                                <input 
                                                    type="url" 
                                                    name="gambar" 
                                                    placeholder="Tempel link disini..." 
                                                    className="w-full px-3.5 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm font-mono bg-white"
                                                />
                                            </div>
                                        </div>
                                        <button 
                                            type="submit" 
                                            disabled={loadingMateri}
                                            className="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs transition-colors shadow-sm cursor-pointer disabled:opacity-50"
                                        >
                                            {loadingMateri ? 'Menyimpan...' : 'Simpan & Terbitkan Materi'}
                                        </button>
                                    </form>
                                </div>

                                <div>
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-3">
                                        <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                            <Icon name="list" size={18} className="text-blue-600"/> 
                                            Daftar Materi ({filteredMateriList.length})
                                        </h3>
                                        <div className="w-full sm:w-auto">
                                            <select 
                                                value={selectedMateriMapelFilter} 
                                                onChange={(e) => setSelectedMateriMapelFilter(e.target.value)}
                                                className="w-full sm:w-auto px-3 py-1.5 border rounded-xl text-xs font-semibold bg-white outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 cursor-pointer"
                                            >
                                                <option value="ALL">Semua Mapel</option>
                                                {MAPEL_LIST.map((m, idx) => (
                                                    <option key={idx} value={m}>{m}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        {filteredMateriList.length === 0 ? (
                                            <p className="text-sm text-slate-400 italic p-4 bg-slate-50 rounded-xl border text-center">Belum ada materi.</p>
                                        ) : (
                                            filteredMateriList.map((item, idx) => (
                                                <div key={idx} className="p-4 bg-white border border-slate-200 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-sm">
                                                    <div className="flex items-center gap-3">
                                                        <img 
                                                            src={item.gambar || 'https://via.placeholder.com/80?text=Img'} 
                                                            alt={item.judul} 
                                                            className="w-12 h-14 rounded-lg object-cover border shrink-0 bg-slate-50"
                                                            onError={(e) => { e.target.onerror = null; e.target.src = 'https://via.placeholder.com/80?text=Img'; }}
                                                        />
                                                        <div>
                                                            <span className="inline-block px-2 py-0.5 bg-blue-50 text-blue-700 text-[10px] font-bold rounded-md mb-1">{item.mapel}</span>
                                                            <h4 className="font-bold text-slate-800 text-sm">{item.judul}</h4>
                                                        </div>
                                                    </div>
                                                    {item.pdf && (
                                                        <a href={item.pdf} target="_blank" rel="noopener noreferrer" className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition-colors">
                                                            Buka PDF
                                                        </a>
                                                    )}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
