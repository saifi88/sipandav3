<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SI-PANDA</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-in { animation: fadeIn 0.2s ease-out forwards, zoomIn 0.2s ease-out forwards; }
        .exam-mode { user-select: none; -webkit-user-select: none; -ms-user-select: none; }

        /* Animasi untuk game — modern playful theme */
        @keyframes gameShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
        @keyframes gamePop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
        @keyframes gameFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes gameCardIn { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes gameStarPop { 0% { transform: scale(0) rotate(-30deg); opacity: 0; } 60% { transform: scale(1.35) rotate(8deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
        @keyframes gameConfetti { 0% { transform: translateY(-10%) rotate(0); opacity: 1; } 100% { transform: translateY(110vh) rotate(540deg); opacity: 0; } }
        @keyframes gameGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(167,139,250,0.55); } 50% { box-shadow: 0 0 0 10px rgba(167,139,250,0); } }
        @keyframes gameGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .game-shake { animation: gameShake 0.45s ease-in-out; }
        .game-pop { animation: gamePop 0.5s ease-out; }
        .game-float { animation: gameFloat 5s ease-in-out infinite; }
        .game-card-in { animation: gameCardIn 0.45s cubic-bezier(0.22,1,0.36,1) both; }
        .game-star-pop { animation: gameStarPop 0.55s cubic-bezier(0.22,1,0.36,1) both; }
        .game-glow { animation: gameGlow 1.8s ease-out infinite; }
        .game-gradient-text { background-size: 200% auto; animation: gameGradient 5s ease infinite; }
        .game-confetti-piece { position: absolute; top: -5%; animation: gameConfetti linear infinite; }
        @keyframes balloonRise { from { transform: translateY(62vh); } to { transform: translateY(-32vh); } }
        @keyframes balloonWobble { 0%, 100% { margin-left: 0; } 25% { margin-left: -8px; } 75% { margin-left: 8px; } }
        @keyframes balloonPop { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }
        .game-balloon { animation: balloonRise linear infinite; }
        .game-balloon-wobble { animation: balloonWobble 0.35s ease-in-out; }
        .game-balloon-pop { animation: balloonPop 0.35s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
    <div id="root"></div>

    <!-- Modul game (dimuat sebelum aplikasi utama) -->
    <script type="text/babel" src="games/gameData.js?v=9"></script>
    <script type="text/babel" src="games/GameShell.js?v=9"></script>
    <script type="text/babel" src="games/MatchGame.js?v=9"></script>
    <script type="text/babel" src="games/MemoryGame.js?v=9"></script>
    <script type="text/babel" src="games/QuizRushGame.js?v=9"></script>
    <script type="text/babel" src="games/BalloonPopGame.js?v=9"></script>
    <script type="text/babel" src="games/ScrambleGame.js?v=9"></script>
    <script type="text/babel" src="games/SnakeLadderGame.js?v=9"></script>
    <script type="text/babel" src="games/TrueFalseGame.js?v=9"></script>
    <script type="text/babel" src="games/HangmanGame.js?v=9"></script>
    <script type="text/babel" src="games/BossBattleGame.js?v=9"></script>
    <script type="text/babel" src="games/SortGame.js?v=9"></script>
    <script type="text/babel" src="games/FillBlankGame.js?v=9"></script>
    <script type="text/babel" src="games/RaceGame.js?v=9"></script>
    <script type="text/babel" src="games/GameHub.js?v=9"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyvjyIw545RQ6VIphJ3hjhz703hwJf0kOwtXj8R2su-64PIbyaiSMiqtP7sTrf7Jt0TFw/exec";
        const SECRET_KEY_PARAM = 'guru'; 
        const LOGO_URL = "https://i.ibb.co.com/pjFNr8Fj/sipanda2.png"; 

        const MAPEL_LIST = [
            "Pendidikan Pancasila", 
            "Bahasa Indonesia", 
            "Matematika", 
            "IPAS", 
            "Seni Rupa", 
            "Bahasa Jawa", 
            "Bahasa Inggris", 
            "Koding & AI"
        ];

        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                'book-open': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>,
                'clock': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
                'alert-circle': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>,
                'check-circle': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>,
                'chevron-left': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="15 18 9 12 15 6"></polyline></svg>,
                'chevron-right': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"></polyline></svg>,
                'log-out': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>,
                'file-text': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>,
                'message-square': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>,
                'save': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
                'download': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
                'edit': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
                'x': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
                'list': <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            };
            return icons[name] || null;
        };

        async function hashString(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const shuffleArray = (array) => {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        };

        const renderContent = (text) => {
            if (!text) return null;
            const parts = text.split(/\[GAMBAR:(.*?)\]/g);
            return parts.map((part, index) => {
                if (index % 2 === 1) {
                    return (
                        <img 
                            key={index} src={part.trim()} alt="Ilustrasi" 
                            className="max-w-full h-auto rounded-lg shadow-sm border border-slate-200 my-2 max-h-56 object-contain bg-white"
                            onError={(e) => { e.target.onerror = null; e.target.src = 'https://via.placeholder.com/300x150?text=Gagal+Muat+Gambar'; }}
                        />
                    );
                }
                if (!part) return null;
                return <span key={index} className="whitespace-pre-wrap">{part}</span>;
            });
        };

        function App() {
            const [currentUser, setCurrentUser] = useState(null); 
            const [view, setView] = useState('login'); 
            const [activeExamData, setActiveExamData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [selectedMapel, setSelectedMapel] = useState(null);
            const [selectedTaskFilter, setSelectedTaskFilter] = useState(null); 
            
            const [activeGame, setActiveGame] = useState(null);
            const [gamePlayKey, setGamePlayKey] = useState(0);
            const [gameContextExamId, setGameContextExamId] = useState(null);

            const [appData, setAppData] = useState({ settings: {}, students: [], exams: [], results: [], materi: [], games: [], gameResults: [] });

            // Gunakan data game dari backend jika ada, jika belum pakai data contoh lokal (games/gameData.js)
            const gamesList = (appData.games && appData.games.length > 0) ? appData.games : SAMPLE_GAMES;

            useEffect(() => {
                const APP_VERSION = "11.09.2026-v9";
                const savedVersion = localStorage.getItem("sipanda_version");
                
                if (savedVersion !== APP_VERSION) {
                    localStorage.setItem("sipanda_version", APP_VERSION);
                    window.location.reload(true);
                    return;
                }

                fetch(WEB_APP_URL + "?action=getInitData&v=" + APP_VERSION)
                    .then(res => res.json())
                    .then(data => {
                        setAppData({
                            settings: data.settings || {},
                            students: data.students || [],
                            exams: data.exams || [],
                            results: data.results || [],
                            materi: data.materi || [],
                            games: data.games || [],
                            gameResults: data.gameResults || []
                        });
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("Gagal koneksi ke spreadsheet:", err);
                        setLoading(false);
                    });
            }, []);

            const handleLogin = (user, role) => {
                setCurrentUser({ ...user, role });
                setView(role === 'admin' ? 'admin' : 'student');
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setView('login');
                setActiveExamData(null);
                setSelectedMapel(null);
                setSelectedTaskFilter(null);
                setActiveGame(null);
            };

            // ---------- GAME (BONUS-ONLY, terhubung ke tugas via linkedExamId) ----------
            const startGame = (game, contextExamId = null) => {
                setActiveGame(game);
                setGameContextExamId(contextExamId);
                setGamePlayKey(k => k + 1);
                setView('game');
            };

            const replayGame = () => setGamePlayKey(k => k + 1);

            const exitGame = () => {
                setActiveGame(null);
                setView('games');
            };

            const finishGame = (result) => {
                const record = {
                    waktu: new Date().toLocaleString("id-ID"),
                    nisn: currentUser.nisn,
                    nama: currentUser.name,
                    gameId: result.gameId,
                    game: result.title,
                    mapel: result.mapel,
                    tipe: result.type,
                    skor: result.skor,
                    benar: result.benar,
                    salah: result.salah,
                    durasiDetik: result.durasiDetik
                };

                // Simpan lokal agar skor terbaik langsung tampil di Zona Game
                setAppData(prev => ({ ...prev, gameResults: [...(prev.gameResults || []), record] }));

                // Anti-farm: maksimal 1 penyimpanan per game per 30 detik (bonus-only)
                const shouldPost = (typeof canSaveGameResult === "function")
                    ? canSaveGameResult(currentUser.nisn, result.gameId)
                    : true;
                if (!shouldPost) return;

                // Kirim ke backend (action "saveGameResult" di code.gs / code_v2.gs)
                fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "saveGameResult", ...record })
                }).catch(err => console.error("Gagal menyimpan hasil game:", err));
            };

            const startExam = (exam) => {
                const elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
                setActiveExamData(exam);
                setView('exam');
            };

            const finishExam = (examId, score, cheatCount, jawabanEssayString, shuffledQuestions, pgCount) => {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
                }
                
                const examTitle = appData.exams.find(e => e.id === examId)?.title || 'Ujian';
                const timeStr = new Date().toLocaleString("id-ID");
                
                const payload = {
                    action: "saveResult",
                    waktu: timeStr,
                    nisn: currentUser.nisn,
                    nama: currentUser.name,
                    ujian: examTitle,
                    nilai: score, // Nilai dasar Pilihan Ganda
                    pgCount: pgCount || 0,
                    questions: shuffledQuestions || [],
                    jawabanEssay: jawabanEssayString || "{}",
                    pelanggaran: cheatCount || 0
                };

                // 1. KIRIM KE BACKEND TERLEBIH DAHULU UNTUK MENDAPATKAN NILAI AI & CATATAN
                fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(response => {
                    console.log("Respon Server AI:", response);
                    
                    // Ambil nilai akhir & catatan dari balasan AI di code.gs
                    const finalScore = response.score !== undefined ? response.score : score;
                    const finalCatatan = response.catatan || "Pengerjaan berhasil disimpan.";

                    // 2. UPDATE STATE LOKAL DENGAN NILAI & CATATAN VALID DARI AI
                    setAppData(prev => ({
                        ...prev,
                        results: [...prev.results, {
                            waktu: timeStr,
                            nisn: currentUser.nisn,
                            nama: currentUser.name,
                            ujian: examTitle,
                            nilai: finalScore,      // <-- Nilai akhir gabungan (PG + Esai AI)
                            catatan: finalCatatan,  // <-- Catatan ulasan holistik dari AI
                            pelanggaran: cheatCount || 0
                        }]
                    }));

                    // 3. ARAHKAN SISWA KE HALAMAN HASIL / DASHBOARD DENGAN DATA YANG SUDAH JADI
                    // (Opsional: Anda bisa langsung melemparkan data ini ke halaman ExamResult agar siswa bisa langsung melihatnya)
                    setView('student');
                    setActiveExamData(null);
                })
                .catch(err => {
                    console.error("Gagal mengirim:", err);
                    alert("Gagal terhubung ke server. Periksa koneksi internet Anda.");
                    setView('student');
                });
            };

            const handleToggleExamStatus = (examId) => {
                setAppData(prev => {
                    const updatedExams = prev.exams.map(ex => {
                        if (ex.id === examId) {
                            const newStatus = !ex.isActive;
                            fetch(WEB_APP_URL, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: "updateExamStatus", examId: examId, isActive: newStatus })
                            });
                            return { ...ex, isActive: newStatus };
                        }
                        return ex;
                    });
                    return { ...prev, exams: updatedExams };
                });
            };

            const handleUpdateCatatan = (nisn, ujian, newCatatan) => {
                setAppData(prev => {
                    const updatedResults = prev.results.map(r => {
                        if (r.nisn === nisn && r.ujian === ujian) {
                            return { ...r, catatan: newCatatan };
                        }
                        return r;
                    });
                    return { ...prev, results: updatedResults };
                });

                fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "updateCatatan", nisn: nisn, ujian: ujian, catatan: newCatatan })
                });
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100">
                        <div className="text-center">
                            <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                            <p className="text-slate-600 font-medium">Loading ...</p>
                        </div>
                    </div>
                );
            }

            const isFullScreenView = view === 'exam' || view === 'game';

            return (
                <div className={`min-h-screen ${view === 'exam' ? 'bg-slate-200' : 'bg-slate-100'} font-sans text-slate-800 flex flex-col`}>
                    {!isFullScreenView && (
                        <header className="bg-white shadow-sm sticky top-0 z-40">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <img src={LOGO_URL} alt="Logo SIPANDA" className="w-10 h-10 rounded-xl object-contain bg-white p-0.5 border border-slate-200 shadow-sm" />
                                    <div>
                                        <h1 className="font-bold text-lg leading-tight text-blue-700">SI-PANDA</h1>
                                        <p className="text-xs text-slate-500">{appData.settings.schoolName || 'SD Negeri 3 Wonorejo'}</p>
                                    </div>
                                </div>
                                {currentUser && (
                                    <div className="flex items-center gap-4">
                                        <div className="hidden md:block text-right">
                                            <p className="text-sm font-semibold">{currentUser.name || 'Administrator'}</p>
                                            <p className="text-xs text-slate-500">{currentUser.role === 'admin' ? 'Guru' : `NISN: ${currentUser.nisn}`}</p>
                                        </div>
                                        <button onClick={handleLogout} className="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-full transition-colors cursor-pointer" title="Keluar">
                                            <Icon name="log-out" size={20} />
                                        </button>
                                    </div>
                                )}
                            </div>
                        </header>
                    )}

                    <main className={`flex-1 w-full ${view === 'game' ? '' : view === 'exam' ? 'max-w-7xl mx-auto p-2 sm:p-6' : 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6'}`}>
                        {view === 'login' && <Login onLogin={handleLogin} students={appData.students} settings={appData.settings} />}
                        {view === 'admin' && (
                            <AdminDashboard 
                                exams={appData.exams} 
                                results={appData.results} 
                                students={appData.students} 
                                materiList={appData.materi} 
                                games={gamesList}
                                gameResults={appData.gameResults}
                                onToggleStatus={handleToggleExamStatus} 
                                onUpdateCatatan={handleUpdateCatatan} 
                            />
                        )}
                        {view === 'student' && (
                            selectedMapel ? (
                                <DaftarMateriView 
                                    mapel={selectedMapel} 
                                    materiList={appData.materi.filter(m => m.mapel === selectedMapel)} 
                                    exams={appData.exams}
                                    games={gamesList}
                                    gameResults={appData.gameResults}
                                    currentUser={currentUser}
                                    onBack={() => setSelectedMapel(null)} 
                                    onPlayGame={(g, examId) => startGame(g, examId)}
                                    onStartExam={(examId) => {
                                        const targetExam = appData.exams.find(ex => ex.id === examId);
                                        if (targetExam) {
                                            startExam(targetExam);
                                        } else {
                                            alert("Maaf, soal ujian terkait tidak ditemukan atau belum dipublikasikan.");
                                        }
                                    }}
                                />
                            ) : selectedTaskFilter ? (
                                <DaftarTugasFilteredView 
                                    filterType={selectedTaskFilter}
                                    exams={appData.exams}
                                    results={appData.results}
                                    games={gamesList}
                                    gameResults={appData.gameResults}
                                    currentUser={currentUser}
                                    onStartExam={startExam}
                                    onPlayGame={(g, examId) => startGame(g, examId)}
                                    onBack={() => setSelectedTaskFilter(null)}
                                />
                            ) : (
                                <StudentDashboard 
                                    exams={appData.exams} 
                                    results={appData.results} 
                                    currentUser={currentUser} 
                                    onStartExam={startExam} 
                                    onSelectMapel={setSelectedMapel} 
                                    onSelectTaskFilter={setSelectedTaskFilter}
                                    onOpenGames={() => setView('games')}
                                    gamesCount={gamesList.length}
                                />
                            )
                        )}
                        {view === 'games' && (
                            <GameHub 
                                games={gamesList}
                                gameResults={appData.gameResults}
                                currentUser={currentUser}
                                exams={appData.exams}
                                contextExamId={gameContextExamId}
                                onPlay={startGame}
                                onBack={() => setView('student')}
                            />
                        )}
                        {view === 'game' && activeGame && activeGame.type === 'match' && (
                            <MatchGame 
                                key={gamePlayKey}
                                game={activeGame}
                                currentUser={currentUser}
                                onFinish={finishGame}
                                onExit={exitGame}
                                onReplay={replayGame}
                            />
                        )}
                        {view === 'game' && activeGame && activeGame.type === 'memory' && (
                            <MemoryGame
                                key={gamePlayKey}
                                game={activeGame}
                                currentUser={currentUser}
                                onFinish={finishGame}
                                onExit={exitGame}
                                onReplay={replayGame}
                            />
                        )}
                        {view === 'game' && activeGame && activeGame.type === 'quizrush' && (
                            <QuizRushGame
                                key={gamePlayKey}
                                game={activeGame}
                                currentUser={currentUser}
                                onFinish={finishGame}
                                onExit={exitGame}
                                onReplay={replayGame}
                            />
                        )}
                        {view === 'game' && activeGame && activeGame.type === 'balloon' && (
                            <BalloonPopGame
                                key={gamePlayKey}
                                game={activeGame}
                                currentUser={currentUser}
                                onFinish={finishGame}
                                onExit={exitGame}
                                onReplay={replayGame}
                            />
                        )}
                        {view === 'game' && activeGame && activeGame.type === 'scramble' && (
                            <ScrambleGame
                                key={gamePlayKey}
                                game={activeGame}
                                currentUser={currentUser}
                                onFinish={finishGame}
                                onExit={exitGame}
                                onReplay={replayGame}
                            />
                        )}
                        {view === 'game' && activeGame && activeGame.type === 'snake' && (
                            <SnakeLadderGame
                                key={gamePlayKey}
                                game={activeGame}
                                currentUser={currentUser}
                                onFinish={finishGame}
                                onExit={exitGame}
                                onReplay={replayGame}
                            />
                        )}
                        {view === 'game' && activeGame && activeGame.type === 'truefalse' && (
                            <TrueFalseGame
                                key={gamePlayKey}
                                game={activeGame}
                                currentUser={currentUser}
                                onFinish={finishGame}
                                onExit={exitGame}
                                onReplay={replayGame}
                            />
                        )}
                        {view === 'game' && activeGame && activeGame.type === 'hangman' && (
                            <HangmanGame
                                key={gamePlayKey}
                                game={activeGame}
                                currentUser={currentUser}
                                onFinish={finishGame}
                                onExit={exitGame}
                                onReplay={replayGame}
                            />
                        )}
                        {view === 'game' && activeGame && activeGame.type === 'boss' && (
                            <BossBattleGame
                                key={gamePlayKey}
                                game={activeGame}
                                currentUser={currentUser}
                                onFinish={finishGame}
                                onExit={exitGame}
                                onReplay={replayGame}
                            />
                        )}
                        {view === 'game' && activeGame && activeGame.type === 'sort' && (
                            <SortGame
                                key={gamePlayKey}
                                game={activeGame}
                                currentUser={currentUser}
                                onFinish={finishGame}
                                onExit={exitGame}
                                onReplay={replayGame}
                            />
                        )}
                        {view === 'game' && activeGame && activeGame.type === 'fillblank' && (
                            <FillBlankGame
                                key={gamePlayKey}
                                game={activeGame}
                                currentUser={currentUser}
                                onFinish={finishGame}
                                onExit={exitGame}
                                onReplay={replayGame}
                            />
                        )}
                        {view === 'game' && activeGame && activeGame.type === 'race' && (
                            <RaceGame
                                key={gamePlayKey}
                                game={activeGame}
                                currentUser={currentUser}
                                onFinish={finishGame}
                                onExit={exitGame}
                                onReplay={replayGame}
                            />
                        )}
                        {view === 'game' && activeGame && !['match', 'memory', 'quizrush', 'balloon', 'scramble', 'snake', 'truefalse', 'hangman', 'boss', 'sort', 'fillblank', 'race'].includes(activeGame.type) && (
                            <MatchGame
                                key={gamePlayKey}
                                game={activeGame}
                                currentUser={currentUser}
                                onFinish={finishGame}
                                onExit={exitGame}
                                onReplay={replayGame}
                            />
                        )}
                        {view === 'exam' && <ExamInterface exam={activeExamData} currentUser={currentUser} onFinish={finishExam} />}
                    </main>
                </div>
            );
        }

        function Login({ onLogin, students, settings }) {
            const [nisn, setNisn] = useState('');
            const [matchedStudent, setMatchedStudent] = useState(null);
            const [error, setError] = useState('');
            
            const urlParams = new URLSearchParams(window.location.search);
            const isAdminRoute = urlParams.has(SECRET_KEY_PARAM);

            const [adminUser, setAdminUser] = useState('');
            const [adminPass, setAdminPass] = useState('');

            const handleNisnChange = (e) => {
                const val = e.target.value;
                setNisn(val);
                setError('');

                if (val.trim() === '') {
                    setMatchedStudent(null);
                    return;
                }

                const found = students.find(s => String(s.nisn).trim() === String(val).trim());
                if (found) {
                    setMatchedStudent(found);
                } else {
                    setMatchedStudent(null);
                }
            };

            const handleStudentLogin = (e) => {
                e.preventDefault();
                if (matchedStudent) {
                    onLogin(matchedStudent, 'student');
                } else {
                    setError('NISN tidak ditemukan di data sekolah. Periksa kembali.');
                }
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                const validUser = settings.adminUser || 'admin';
                const inputPassHash = await hashString(adminPass);
                const validPassHash = settings.adminPassHash || '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9';

                if (adminUser === validUser && inputPassHash === validPassHash) {
                    onLogin({ name: 'Guru / Admin' }, 'admin');
                } else {
                    setError('Username atau Password salah.');
                }
            };

            return (
                <div className="max-w-md mx-auto mt-6 px-4">
                    <div className="text-center mb-6">
                        <img src={LOGO_URL} alt="Logo SIPANDA" className="w-20 h-20 rounded-2xl object-contain mx-auto mb-3 shadow-md bg-white p-2 border border-slate-100" />
                        <h2 className="text-2xl font-black text-slate-800">SI-PANDA</h2>
                        <p className="text-xs font-semibold text-blue-600 uppercase tracking-widest mt-0.5">Sistem Informasi Penugasan Digital Anak</p>
                        <p className="text-sm text-slate-500 mt-2 px-4 leading-relaxed">
                            Hai ! Masukkan NISN kalian untuk belajar ringkasan materi & mengerjakan tugas yang tersedia.
                        </p>
                    </div>

                    <div className="bg-white p-8 rounded-2xl shadow-lg border border-slate-100">
                        <h3 className="text-xl font-bold text-center mb-6 text-slate-800">
                            {isAdminRoute ? 'Masuk' : 'Login'}
                        </h3>

                        {error && <div className="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg flex items-start gap-2"><Icon name="alert-circle" size={18} className="shrink-0 mt-0.5"/>{error}</div>}

                        {!isAdminRoute ? (
                            <form onSubmit={handleStudentLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">NISN</label>
                                    <input 
                                        type="text" 
                                        required 
                                        value={nisn} 
                                        onChange={handleNisnChange} 
                                        className="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 font-mono text-base" 
                                        placeholder="Ketik NISN disini" 
                                        autoFocus
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Nama</label>
                                    <div className={`w-full px-4 py-2.5 border rounded-lg text-sm font-bold flex items-center justify-between ${matchedStudent ? 'bg-green-50 border-green-200 text-green-800' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                        <span>{matchedStudent ? matchedStudent.name : (nisn ? 'NISN tidak terdaftar' : 'Menunggu NISN diketik...')}</span>
                                        {matchedStudent && <Icon name="check-circle" size={18} className="text-green-600 shrink-0" />}
                                    </div>
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={!matchedStudent} 
                                    className="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 text-white rounded-lg font-semibold transition-colors mt-2 shadow-sm cursor-pointer disabled:cursor-not-allowed"
                                >
                                    LANJUT
                                </button>
                            {/* --- TAMBAHAN LINK KE HALAMAN ADMIN --- */}
                                <div className="pt-3 text-center border-t border-slate-100 mt-4">
                                    <a 
                                        href="admin.html" 
                                        className="text-xs text-slate-400 hover:text-blue-600 transition-colors font-medium"
                                    >
                                        🔐 Login Admin
                                    </a>
                                </div>
                            </form>
                        ) : (
                            <form onSubmit={handleAdminLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Username</label>
                                    <input type="text" required value={adminUser} onChange={e => setAdminUser(e.target.value)} className="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Password</label>
                                    <input type="password" required value={adminPass} onChange={e => setAdminPass(e.target.value)} className="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
                                </div>
                                <button type="submit" className="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-semibold transition-colors mt-2 shadow-sm">MASUK</button>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        function StudentDashboard({ exams, results, currentUser, onStartExam, onSelectMapel, onSelectTaskFilter, onOpenGames, gamesCount = 0 }) {
            const activeExams = exams.filter(e => e.isActive);
            const totalExams = activeExams.length;
            const studentResults = (results || []).filter(r => r.nisn === currentUser.nisn);
            
            const completedCount = activeExams.filter(exam => 
                studentResults.some(r => r.ujian === exam.title)
            ).length;
            const pendingCount = totalExams - completedCount;

            // Hitung persentase progress pengerjaan tugas
            const progressPercentage = totalExams > 0 ? Math.round((completedCount / totalExams) * 100) : 0;

            return (
                <div className="space-y-6">
                    {/* Kartu Sambutan & Progress Bar */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                        <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                            <div>
                                <h2 className="text-xl font-bold text-slate-800">Hallo, {currentUser.name}!</h2>
                                <p className="text-slate-500 text-sm mt-0.5">Lihat ringkasan materi pelajaran dan daftar tugas rumahmu.</p>
                            </div>
                            <div className="bg-blue-50 text-blue-700 px-4 py-2 rounded-xl text-xs font-bold border border-blue-100 shrink-0">
                                Selesai: {completedCount} dari {totalExams} Tugas ({progressPercentage}%)
                            </div>
                        </div>

                        {/* Bilah Kemajuan / Progress Bar */}
                        <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden p-0.5 border border-slate-200">
                            <div 
                                className="bg-gradient-to-r from-blue-500 to-emerald-500 h-full rounded-full transition-all duration-500 shadow-sm"
                                style={{ width: `${progressPercentage}%` }}
                            ></div>
                        </div>
                    </div>

                    {/* Card Statistik dengan Warna Pastel Lembut */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div 
                            onClick={() => onSelectTaskFilter('ALL')}
                            className="bg-gradient-to-br from-blue-200 to-indigo-50/40 p-5 rounded-2xl shadow-sm border border-blue-500 cursor-pointer transition-all hover:shadow-md group"
                        >
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-blue-500 text-white rounded-xl flex items-center justify-center font-bold shadow-sm">
                                    <Icon name="file-text" size={24} />
                                </div>
                                <div>
                                    <p className="text-xs text-blue-600 font-bold uppercase tracking-wide">Total Tugas Rumah</p>
                                    <h3 className="text-2xl font-black text-slate-800">{totalExams}</h3>
                                </div>
                            </div>
                            <p className="text-[11px] text-blue-600 font-semibold mt-3">Lihat →</p>
                        </div>

                        <div 
                            onClick={() => onSelectTaskFilter('DONE')}
                            className="bg-gradient-to-br from-emerald-200 to-teal-50/40 p-5 rounded-2xl shadow-sm border border-emerald-500 cursor-pointer transition-all hover:shadow-md group"
                        >
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-emerald-500 text-white rounded-xl flex items-center justify-center font-bold shadow-sm">
                                    <Icon name="check-circle" size={24} />
                                </div>
                                <div>
                                    <p className="text-xs text-emerald-600 font-bold uppercase tracking-wide">Sudah dikerjakan</p>
                                    <h3 className="text-2xl font-black text-emerald-700">{completedCount}</h3>
                                </div>
                            </div>
                            <p className="text-[11px] text-emerald-600 font-semibold mt-3">Lihat →</p>
                        </div>

                        <div 
                            onClick={() => onSelectTaskFilter('PENDING')}
                            className="bg-gradient-to-br from-amber-200 to-orange-50/40 p-5 rounded-2xl shadow-sm border border-amber-500 cursor-pointer transition-all hover:shadow-md group"
                        >
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-amber-500 text-white rounded-xl flex items-center justify-center font-bold shadow-sm">
                                    <Icon name="clock" size={24} />
                                </div>
                                <div>
                                    <p className="text-xs text-amber-600 font-bold uppercase tracking-wide">Belum dikerjakan</p>
                                    <h3 className="text-2xl font-black text-amber-700">{pendingCount}</h3>
                                </div>
                            </div>
                            <p className="text-[11px] text-amber-600 font-semibold mt-3">Lihat →</p>
                        </div>
                    </div>

                    {/* Banner Zona Game */}
                    <div 
                        onClick={onOpenGames}
                        className="bg-gradient-to-r from-violet-600 to-fuchsia-500 text-white p-6 rounded-2xl shadow-md cursor-pointer hover:shadow-lg transition-all flex items-center justify-between gap-4 group"
                    >
                        <div>
                            <span className="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2 inline-block">Baru</span>
                            <h3 className="text-lg font-bold">🎮 Zona Game: Belajar Sambil Bermain</h3>
                            <p className="text-violet-100 text-sm mt-1">Latihan bonus — tidak mengubah nilai tugas. Cocokkan kartu, kumpulkan bintang, dan kalahkan skor terbaikmu. {gamesCount} game tersedia.</p>
                        </div>
                        <div className="shrink-0 bg-white text-violet-700 font-bold text-sm px-5 py-3 rounded-xl shadow-sm group-hover:scale-105 transition-transform">
                            Main →
                        </div>
                    </div>

                    <div className="bg-indigo-600 text-white p-6 rounded-2xl shadow-md">
                        <span className="bg-indigo-500 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2 inline-block">Pusat Belajar</span>
                        <h3 className="text-lg font-bold">Unduh & Pelajari Materi Pelajaran di Bawah Ini</h3>
                        <p className="text-indigo-100 text-sm mt-1">Sebaiknya unduh ringkasan materi kemudian pelajari terlebih dahulu sebelum mulai mengerjakan tugas.</p>
                    </div>

                    <div>
                        <h3 className="text-lg font-bold text-slate-800 mb-3">Pilih mapel yang akan kamu pelajari</h3>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            {MAPEL_LIST.map((mapel, idx) => {
                                const colors = [
                                    { bg: "bg-blue-50/60 hover:bg-blue-100/60", border: "border-blue-200", iconBg: "bg-blue-500 text-white", text: "text-blue-900" },
                                    { bg: "bg-purple-50/60 hover:bg-purple-100/60", border: "border-purple-200", iconBg: "bg-purple-500 text-white", text: "text-purple-900" },
                                    { bg: "bg-emerald-50/60 hover:bg-emerald-100/60", border: "border-emerald-200", iconBg: "bg-emerald-500 text-white", text: "text-emerald-900" },
                                    { bg: "bg-amber-50/60 hover:bg-amber-100/60", border: "border-amber-200", iconBg: "bg-amber-500 text-white", text: "text-amber-900" },
                                    { bg: "bg-rose-50/60 hover:bg-rose-100/60", border: "border-rose-200", iconBg: "bg-rose-500 text-white", text: "text-rose-900" },
                                    { bg: "bg-cyan-50/60 hover:bg-cyan-100/60", border: "border-cyan-200", iconBg: "bg-cyan-500 text-white", text: "text-cyan-900" },
                                    { bg: "bg-indigo-50/60 hover:bg-indigo-100/60", border: "border-indigo-200", iconBg: "bg-indigo-500 text-white", text: "text-indigo-900" },
                                    { bg: "bg-teal-50/60 hover:bg-teal-100/60", border: "border-teal-200", iconBg: "bg-teal-500 text-white", text: "text-teal-900" },
                                ];
                                const theme = colors[idx % colors.length];

                                return (
                                    <button 
                                        key={idx}
                                        onClick={() => onSelectMapel(mapel)}
                                        className={`${theme.bg} p-5 rounded-2xl shadow-sm border ${theme.border} hover:shadow-md transition-all text-left flex flex-col justify-between group cursor-pointer`}
                                    >
                                        <div className={`w-10 h-10 ${theme.iconBg} rounded-xl flex items-center justify-center font-bold mb-3 shadow-sm transition-transform group-hover:scale-105`}>
                                            <Icon name="book-open" size={20} />
                                        </div>
                                        <div>
                                            <p className={`font-bold text-sm ${theme.text} transition-colors`}>{mapel}</p>
                                            <p className="text-xs text-slate-500 mt-1">Lihat Materi →</p>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function DaftarTugasFilteredView({ filterType, exams, results, games = [], gameResults = [], currentUser, onStartExam, onPlayGame, onBack }) {
            // State lokal untuk mengatur pop-up ulasan AI
            const [selectedCatatan, setSelectedCatatan] = React.useState(null);

            const activeExams = exams.filter(e => e.isActive);
            const studentResults = (results || []).filter(r => r.nisn === currentUser.nisn);
            
            const sortedActiveExams = [...activeExams].reverse();

            const completedExamsList = sortedActiveExams.filter(exam => 
                studentResults.some(r => r.ujian === exam.title)
            );
            const pendingExamsList = sortedActiveExams.filter(exam => 
                !studentResults.some(r => r.ujian === exam.title)
            );

            let displayedExams = sortedActiveExams;
            let titleText = "Semua Tugas";
            if (filterType === 'DONE') {
                displayedExams = completedExamsList;
                titleText = "Tugas yang Sudah Dikerjakan";
            } else if (filterType === 'PENDING') {
                displayedExams = pendingExamsList;
                titleText = "Tugas Belum Dikerjakan";
            }

            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border">
                        <div className="flex items-center gap-3">
                            <button onClick={onBack} className="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors font-bold text-sm flex items-center gap-1 cursor-pointer">
                                <Icon name="chevron-left" size={18} /> Kembali
                            </button>
                            <div>
                                <h2 className="text-xl font-bold text-slate-800">{titleText}</h2>
                                <p className="text-xs text-slate-500">Total: {displayedExams.length} tugas</p>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {displayedExams.map((exam, index) => {
                            // Cek apakah tugas ini memiliki soal essay
                            const isEssayExam = exam.questions && exam.questions.some(q => 
                                !q.options || q.options.length === 0 || q.options.every(opt => opt === undefined || opt === null || opt.toString().trim() === '')
                            );

                            const isDone = studentResults.some(r => r.ujian === exam.title);
                            const res = studentResults.find(r => r.ujian === exam.title);
                            const isNew = index < 4 && !isDone;

                            return (
                                <div key={exam.id} className="bg-white rounded-2xl border p-5 shadow-sm flex flex-col justify-between relative overflow-hidden">
                                    {isNew && (
                                        <div className="absolute top-0 right-0 bg-red-600 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl uppercase tracking-wider">
                                            Baru
                                        </div>
                                    )}

                                    <div>
                                        <h3 className="font-bold text-slate-800 text-base mb-3 pr-12">{exam.title}</h3>
                                        
                                        {/* Badge Jenis Soal (ESSAY / PG) di depan waktu */}
                                        <div className="flex items-center gap-2 text-xs text-slate-500 mb-4">
                                            <span className={`px-2 py-0.5 rounded font-bold text-[10px] text-white ${isEssayExam ? 'bg-amber-500' : 'bg-blue-500'}`}>
                                                {isEssayExam ? 'ESSAY' : 'PG'}
                                            </span>
                                            <span className="flex items-center gap-1">
                                                <Icon name="clock" size={14} /> {exam.duration} Menit
                                            </span>
                                        </div>
                                    </div>

                                    {/* Bagian Status Ujian: Selesai atau Belum */}
                                    {isDone ? (
                                        <div className="space-y-2">
                                            <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 p-3 rounded-xl text-xs font-semibold text-center">
                                                ✓ Selesai ({res.nilai})
                                            </div>

                                            {/* Tombol Lihat Ulasan */}
                                            {res && res.catatan && (
                                                <button 
                                                    onClick={() => setSelectedCatatan(res.catatan)}
                                                    className="w-full py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl text-xs font-bold transition-colors flex items-center justify-center gap-1.5 border border-indigo-100 cursor-pointer"
                                                >
                                                    <span>💬 Catatan Guru</span>
                                                </button>
                                            )}
                                        </div>
                                    ) : (
                                        <button 
                                            onClick={() => onStartExam(exam)} 
                                            className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-colors cursor-pointer shadow-sm"
                                        >
                                            Mulai Kerjakan
                                        </button>
                                    )}

                                    {/* Game latihan bonus yang terhubung ke tugas ini */}
                                    {(() => {
                                        const linked = (typeof gamesForExam === "function")
                                            ? gamesForExam(games, exam)
                                            : (games || []).filter(g => g.linkedExamId && String(g.linkedExamId) === String(exam.id));
                                        if (!linked || linked.length === 0) return null;
                                        return (
                                            <div className="mt-3 pt-3 border-t border-dashed border-slate-200 space-y-2">
                                                <p className="text-[10px] font-bold text-violet-600 uppercase tracking-wide">🎮 Latihan Bonus ({linked.length}) — tidak memengaruhi nilai</p>
                                                {linked.slice(0, 2).map(g => {
                                                    const best = (typeof bestScoreForGame === "function")
                                                        ? bestScoreForGame(gameResults, currentUser.nisn, g.id)
                                                        : null;
                                                    return (
                                                        <button key={g.id} onClick={() => onPlayGame && onPlayGame(g, exam.id)}
                                                            className="w-full py-2 px-3 bg-violet-50 hover:bg-violet-100 border border-violet-200 text-violet-800 rounded-xl text-xs font-bold transition-colors flex items-center justify-between gap-2 cursor-pointer">
                                                            <span className="truncate">▶ {g.title}</span>
                                                            <span className="shrink-0 text-[10px]">{best === null ? "Belum main" : `Terbaik: ${best}`}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        );
                                    })()}
                                </div>
                            );
                        })}
                    </div>

                    {/* --- MODAL / POP-UP ULASAN --- */}
                    {selectedCatatan && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all">
                                <div className="flex items-center justify-between mb-4 pb-2 border-b border-gray-100">
                                    <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                                        Ulasan & Masukan
                                    </h3>
                                    <button 
                                        onClick={() => setSelectedCatatan(null)}
                                        className="text-gray-400 hover:text-gray-600 text-xl font-bold w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100"
                                    >
                                        &times;
                                    </button>
                                </div>
                                
                                <div className="max-h-60 overflow-y-auto mb-6 pr-2">
                                    <p className="text-gray-700 text-sm leading-relaxed whitespace-pre-line bg-gray-50 p-4 rounded-xl border border-gray-100">
                                        {selectedCatatan}
                                    </p>
                                </div>

                                <div className="flex justify-end">
                                    <button 
                                        onClick={() => setSelectedCatatan(null)}
                                        className="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-xl transition-colors shadow-sm"
                                    >
                                        Tutup
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function DaftarMateriView({ mapel, materiList, exams = [], games = [], gameResults = [], currentUser, onBack, onStartExam, onPlayGame }) {
            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border">
                        <div className="flex items-center gap-3">
                            <button onClick={onBack} className="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors font-bold text-sm flex items-center gap-1 cursor-pointer">
                                <Icon name="chevron-left" size={18} /> Kembali
                            </button>
                            <div>
                                <h2 className="text-xl font-bold text-slate-800">{mapel}</h2>
                                <p className="text-xs text-slate-500">Daftar ringkasan materi dan latihan soal</p>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {materiList.length === 0 ? (
                            <div className="col-span-full text-center py-12 bg-white rounded-2xl border border-slate-100 shadow-sm">
                                <p className="text-slate-400 font-medium">Belum ada ringkasan materi untuk mata pelajaran ini.</p>
                            </div>
                        ) : (
                            materiList.map((item, idx) => (
                                <div key={idx} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                                    <img 
                                        src={item.gambar || 'https://via.placeholder.com/150?text=Sampul'} 
                                        alt={item.judul} 
                                        className="w-20 h-24 rounded-xl object-cover border border-slate-200 shadow-sm shrink-0 bg-slate-50"
                                        onError={(e) => { e.target.onerror = null; e.target.src = 'https://via.placeholder.com/150?text=Sampul'; }}
                                    />
                                    <div className="flex-1 min-w-0">
                                        <h4 className="font-bold text-base text-slate-800 truncate mb-1">{item.judul}</h4>
                                        <p className="text-xs text-slate-500 mb-3 line-clamp-2">Baca materi PDF lalu kerjakan soal latihannya.</p>
                                        
                                        {/* Bagian Tombol Aksi (Unduh PDF & Kerjakan Soal) */}
                                        <div className="flex flex-wrap items-center gap-2">
                                            {item.pdf && (
                                                <a 
                                                    href={item.pdf} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer" 
                                                    className="inline-flex items-center gap-1 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-colors"
                                                >
                                                    <Icon name="file-text" size={14} /> Baca Materi
                                                </a>
                                            )}

                                            {/* Tombol Pintasan ke Soal Ujian (Hanya muncul jika di admin dihubungkan ke examId) */}
                                            {item.linkedExamId && onStartExam && (
                                                <button 
                                                    onClick={() => onStartExam(item.linkedExamId)} 
                                                    className="inline-flex items-center gap-1 px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-colors shadow-sm cursor-pointer"
                                                >
                                                    ✍️ Kerjakan Soal
                                                </button>
                                            )}
                                        </div>
                                        {/* Game latihan bonus untuk materi / tugas terkait */}
                                        {(() => {
                                            const linked = (games || []).filter(g =>
                                                (item.linkedExamId && g.linkedExamId && String(g.linkedExamId) === String(item.linkedExamId)) ||
                                                (!g.linkedExamId && g.mapel === mapel)
                                            ).slice(0, 2);
                                            if (linked.length === 0) return null;
                                            return (
                                                <div className="flex flex-wrap items-center gap-2 mt-2">
                                                    {linked.map(g => (
                                                        <button key={g.id}
                                                            onClick={() => onPlayGame && onPlayGame(g, item.linkedExamId || null)}
                                                            className="inline-flex items-center gap-1 px-3 py-2 bg-violet-100 hover:bg-violet-200 text-violet-800 rounded-xl text-xs font-bold transition-colors cursor-pointer"
                                                            title="Latihan bonus — tidak memengaruhi nilai tugas"
                                                        >
                                                            🎮 {g.title}
                                                        </button>
                                                    ))}
                                                </div>
                                            );
                                        })()}
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        function ExamInterface({ exam, currentUser, onFinish }) {
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(exam.duration * 60);
            const [isFinished, setIsFinished] = useState(false);
            const [shuffledQuestions, setShuffledQuestions] = useState([]);
            
            // State tambahan untuk Ragu-ragu & Modal Peringatan Custom
            const [raguRaguSet, setRaguRaguSet] = useState(new Set());
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [showTimeUpModal, setShowTimeUpModal] = useState(false);
            const [showCheatModal, setShowCheatModal] = useState(false);
            const [cheatWarningCount, setCheatWarningCount] = useState(0);
            
            const sessionKey = `cbt_exam_${currentUser.nisn}_${exam.id}`;

            useEffect(() => {
                const savedSession = localStorage.getItem(sessionKey);
                if (savedSession) {
                    const parsed = JSON.parse(savedSession);
                    setAnswers(parsed.answers || {});
                    setTimeLeft(parsed.timeLeft || exam.duration * 60);
                    setShuffledQuestions(parsed.shuffledQuestions || exam.questions);
                    setCheatWarningCount(parsed.cheatWarningCount || 0);
                    if (parsed.raguRagu) {
                        setRaguRaguSet(new Set(parsed.raguRagu));
                    }
                } else {
                    const randomlyShuffled = shuffleArray(exam.questions);
                    setShuffledQuestions(randomlyShuffled);
                    localStorage.setItem(sessionKey, JSON.stringify({ answers: {}, timeLeft: exam.duration * 60, shuffledQuestions: randomlyShuffled, cheatWarningCount: 0, raguRagu: [] }));
                }
            }, []);

            useEffect(() => {
                if (isFinished || showTimeUpModal || shuffledQuestions.length === 0) return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) { clearInterval(timer); setShowTimeUpModal(true); return 0; }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [isFinished, showTimeUpModal, shuffledQuestions]);

            useEffect(() => {
                if (isFinished) return;
                const preventDefault = e => e.preventDefault();
                const handleVisibility = () => {
                    if (document.hidden) {
                        setCheatWarningCount(prev => {
                            const newCount = prev + 1;
                            localStorage.setItem(sessionKey, JSON.stringify({ answers, timeLeft, shuffledQuestions, cheatWarningCount: newCount, raguRagu: Array.from(raguRaguSet) }));
                            return newCount;
                        });
                        setShowCheatModal(true);
                    }
                };
                document.addEventListener('contextmenu', preventDefault);
                document.addEventListener('copy', preventDefault);
                document.addEventListener('paste', preventDefault);
                document.addEventListener('visibilitychange', handleVisibility);
                return () => {
                    document.removeEventListener('contextmenu', preventDefault);
                    document.removeEventListener('copy', preventDefault);
                    document.removeEventListener('paste', preventDefault);
                    document.removeEventListener('visibilitychange', handleVisibility);
                };
            }, [isFinished, answers, timeLeft, shuffledQuestions, raguRaguSet]);

            const handleAnswer = (qId, value) => {
                const newAns = { ...answers, [qId]: value };
                setAnswers(newAns);
                localStorage.setItem(sessionKey, JSON.stringify({ answers: newAns, timeLeft, shuffledQuestions, cheatWarningCount, raguRagu: Array.from(raguRaguSet) }));
            };

            // Fungsi Toggle Ragu-Ragu
            const handleToggleRaguRagu = () => {
                setRaguRaguSet(prev => {
                    const newSet = new Set(prev);
                    if (newSet.has(currentQIndex)) {
                        newSet.delete(currentQIndex);
                    } else {
                        newSet.add(currentQIndex);
                    }
                    localStorage.setItem(sessionKey, JSON.stringify({ answers, timeLeft, shuffledQuestions, cheatWarningCount, raguRagu: Array.from(newSet) }));
                    return newSet;
                });
            };

            // Fungsi saat tombol Kumpulkan ditekan
            const submitExam = () => {
                setShowConfirmModal(false);
                setShowTimeUpModal(false);
                setShowCheatModal(false);
                setIsFinished(true);
                
                let correct = 0;
                let pgCount = 0;
                
                shuffledQuestions.forEach(q => {
                    const isEssay = !q.options || q.options.length === 0 || q.options.every(opt => !opt || opt.toString().trim() === '');
                    if (!isEssay) {
                        pgCount++;
                        if (answers[q.id] === q.answer) correct++;
                    }
                });
                
                const score = pgCount > 0 ? Math.round((correct / pgCount) * 100) : 0; 
                const jawabanEssayString = JSON.stringify(answers);
                localStorage.removeItem(sessionKey);
                
                onFinish(exam.id, score, cheatWarningCount, jawabanEssayString, shuffledQuestions, pgCount);
            };

            const formatTime = s => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
            if (shuffledQuestions.length === 0) return null;
            const question = shuffledQuestions[currentQIndex];
            
            const isEssayQuestion = !question.options || 
                question.options.length === 0 || 
                question.options.every(opt => opt === undefined || opt === null || opt.toString().trim() === '');

            // Hitung statistik untuk pop-up konfirmasi
            const unansweredCount = shuffledQuestions.filter((q, idx) => {
                const ans = answers[q.id];
                const isBlank = (q.options && q.options.length > 0) ? (ans === undefined) : (!ans || ans.toString().trim() === '');
                return isBlank;
            }).length;
            const raguCount = raguRaguSet.size;

            return (
                <div className="min-h-screen bg-slate-200 flex flex-col w-full">
                    
                    {/* --- HEADER NAVBAR ATAS */}
                    <header className="bg-blue-900 text-white px-6 py-3.5 flex justify-between items-center shadow-md border-b border-blue-800">
                        <h1 className="text-base md:text-lg font-bold tracking-wider uppercase">
                            {exam.title}
                        </h1>
                        <div className="flex items-center gap-3">
